<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">The product now has three readers</title>
  <desc id="desc">A diagram showing the creator, human user, and AI agent reading the manual as part of the product surface.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1f2937" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1200" height="720" fill="#fbfaf7"/>
  <text x="600" y="72" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700" fill="#111827">The product now has three readers</text>
  <text x="600" y="116" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" fill="#4b5563">The manual is no longer just support material. It is part of the interface.</text>

  <rect x="438" y="248" width="324" height="202" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="299" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#111827">Manual</text>
  <text x="600" y="337" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" fill="#475569">stable names</text>
  <text x="600" y="368" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" fill="#475569">examples</text>
  <text x="600" y="399" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" fill="#475569">recovery paths</text>
  <text x="600" y="430" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" fill="#475569">human stop points</text>

  <rect x="86" y="188" width="262" height="170" rx="16" fill="#e7f1ff" stroke="#7aa7d9" stroke-width="2"/>
  <text x="217" y="235" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#13315c">Creator</text>
  <text x="217" y="278" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#24476f">Needs the system</text>
  <text x="217" y="306" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#24476f">to outlive memory</text>

  <rect x="852" y="188" width="262" height="170" rx="16" fill="#e8f6ee" stroke="#6db987" stroke-width="2"/>
  <text x="983" y="235" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#14532d">Human user</text>
  <text x="983" y="278" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#276749">Needs value</text>
  <text x="983" y="306" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#276749">without the backstory</text>

  <rect x="469" y="520" width="262" height="150" rx="16" fill="#fff4df" stroke="#e1a34a" stroke-width="2"/>
  <text x="600" y="565" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#7c3f00">AI agent</text>
  <text x="600" y="607" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#8a5a13">Needs handles,</text>
  <text x="600" y="635" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#8a5a13">constraints, and intent</text>

  <path d="M348 273 C386 285 405 308 438 324" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M852 273 C814 285 795 308 762 324" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M600 520 C600 496 600 479 600 450" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

</svg>
