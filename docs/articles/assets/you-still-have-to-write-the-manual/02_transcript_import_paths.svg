<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">The requested path and the discovered path</title>
  <desc id="desc">A two-column diagram comparing a slow one-transcript loop with the agent-discovered feed, vault, and bulk import path.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#111827" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1200" height="780" fill="#fbfaf7"/>
  <text x="600" y="72" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700" fill="#111827">The path I asked for. The path the agent found.</text>
  <text x="600" y="114" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" fill="#4b5563">Legible systems let agents choose better doors.</text>

  <rect x="72" y="160" width="480" height="540" rx="24" fill="#ffffff" stroke="#d4d4d8" stroke-width="2" filter="url(#shadow)"/>
  <text x="312" y="215" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#7f1d1d">The visible loop</text>
  <text x="312" y="252" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#6b7280">A human workflow, repeated one item at a time</text>

  <rect x="160" y="300" width="304" height="54" rx="12" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="312" y="334" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#7f1d1d">Open Apple Developer app</text>
  <path d="M312 354 L312 385" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="160" y="392" width="304" height="54" rx="12" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="312" y="426" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#7f1d1d">Copy one transcript</text>
  <path d="M312 446 L312 477" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="160" y="484" width="304" height="54" rx="12" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="312" y="518" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#7f1d1d">Clean and store one memory</text>
  <path d="M312 538 L312 569" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="160" y="576" width="304" height="54" rx="12" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="312" y="610" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#7f1d1d">Repeat for the corpus</text>

  <rect x="648" y="160" width="480" height="540" rx="24" fill="#ffffff" stroke="#d4d4d8" stroke-width="2" filter="url(#shadow)"/>
  <text x="888" y="215" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#14532d">The discovered path</text>
  <text x="888" y="252" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#6b7280">A system path, found through names and docs</text>

  <rect x="736" y="300" width="304" height="54" rx="12" fill="#dcfce7" stroke="#86efac"/>
  <text x="888" y="334" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#14532d">Find transcript feed</text>
  <path d="M888 354 L888 385" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="736" y="392" width="304" height="54" rx="12" fill="#dcfce7" stroke="#86efac"/>
  <text x="888" y="426" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#14532d">Build Markdown vault</text>
  <path d="M888 446 L888 477" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="736" y="484" width="304" height="54" rx="12" fill="#dcfce7" stroke="#86efac"/>
  <text x="888" y="518" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#14532d">Use bulk import</text>
  <path d="M888 538 L888 569" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="736" y="576" width="304" height="54" rx="12" fill="#dcfce7" stroke="#86efac"/>
  <text x="888" y="610" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#14532d">Verify indexed corpus</text>

  <rect x="394" y="716" width="412" height="42" rx="21" fill="#eef2ff" stroke="#a5b4fc"/>
  <text x="600" y="743" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#3730a3">The manual turned a chore into a pipeline.</text>
</svg>
