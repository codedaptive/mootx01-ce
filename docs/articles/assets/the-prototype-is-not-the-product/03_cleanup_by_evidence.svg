<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc">
  <title id="title">Cleanup follows evidence rather than a familiar name</title>
  <desc id="desc">A decision tree shows normal direct wiring when no enabled plugin owns the connection, and evidence-based removal or preservation when the plugin does own it.</desc>
  <rect width="1120" height="700" fill="#fbfaf7"/>

  <text x="560" y="58" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#111827">Cleanup follows evidence, not the name</text>
  <text x="560" y="96" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#475569">Automation removes an entry only after proving both ownership and default scope.</text>

  <rect x="385" y="135" width="350" height="82" rx="10" fill="#f2edff" stroke="#8b5cf6" stroke-width="3"/>
  <text x="560" y="168" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#4c1d95">Does an enabled plugin own</text>
  <text x="560" y="197" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#4c1d95">this client's connection?</text>

  <path d="M385 176 H245 V290" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="285" y="164" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#475569">No</text>
  <rect x="85" y="300" width="320" height="120" rx="10" fill="#eaf2ff" stroke="#4f83cc" stroke-width="3"/>
  <text x="245" y="344" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#12356b">Keep normal direct wiring</text>
  <text x="245" y="378" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#14345f">The installer remains the owner.</text>
  <text x="245" y="403" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#475569">No connection is removed.</text>

  <path d="M735 176 H875 V270" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="835" y="164" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#475569">Yes</text>
  <rect x="715" y="280" width="320" height="110" rx="10" fill="#fff7e6" stroke="#d97706" stroke-width="3"/>
  <text x="875" y="320" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#8a4b00">Inspect the old entry</text>
  <text x="875" y="352" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#7a4300">Recognized shape?</text>
  <text x="875" y="377" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#7a4300">Default data scope?</text>

  <path d="M780 390 C690 435 650 445 590 495" stroke="#39a368" stroke-width="3" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="690" y="433" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#116033">Both proven</text>
  <rect x="410" y="505" width="300" height="105" rx="10" fill="#e8f6ee" stroke="#39a368" stroke-width="3"/>
  <text x="560" y="548" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#116033">Remove our stale default</text>
  <text x="560" y="582" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#14532d">The plugin remains the sole owner.</text>

  <path d="M955 390 C1010 435 995 470 900 505" stroke="#e05260" stroke-width="3" fill="none" marker-end="url(#arrowRed)"/>
  <text x="980" y="433" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#9f1239">Unknown or scoped</text>
  <rect x="750" y="505" width="300" height="105" rx="10" fill="#fff1f2" stroke="#e05260" stroke-width="3"/>
  <text x="900" y="548" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#9f1239">Preserve and report</text>
  <text x="900" y="582" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#9f1239">A person inspects the exception.</text>

  <rect x="90" y="650" width="940" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="560" y="674" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#111827">One connection per client, without erasing deliberate development state.</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#39a368"/></marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e05260"/></marker>
  </defs>
</svg>
