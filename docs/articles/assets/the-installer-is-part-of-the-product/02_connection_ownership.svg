<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Connection ownership decision</title>
  <desc id="desc">A decision tree showing how an installer treats its own stale entry, another supported owner, and an unknown entry.</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#475569"/></marker></defs>
  <rect width="1200" height="760" fill="#fbfaf7"/>
  <text x="600" y="70" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="700" fill="#111827">Who owns the existing connection?</text>
  <text x="600" y="112" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" fill="#4b5563">Ownership turns cleanup into a bounded decision.</text>

  <rect x="420" y="160" width="360" height="92" rx="18" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
  <text x="600" y="198" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" fill="#312e81">Existing client entry found</text>
  <text x="600" y="229" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" fill="#4338ca">Classify before changing anything</text>

  <path d="M600 252 L600 316" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M600 286 C470 286 315 306 230 350" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M600 286 C730 286 885 306 970 350" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <rect x="65" y="370" width="330" height="205" rx="20" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
  <text x="230" y="418" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#065f46">Product-owned stale entry</text>
  <text x="230" y="468" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" fill="#047857">Back up the current config.</text>
  <text x="230" y="501" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" fill="#047857">Replace or remove the stale entry.</text>
  <text x="230" y="534" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#065f46">Then verify the client path.</text>

  <rect x="435" y="370" width="330" height="205" rx="20" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="600" y="418" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#1e3a8a">Supported alternate owner</text>
  <text x="600" y="468" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" fill="#1d4ed8">Do not create a competitor.</text>
  <text x="600" y="501" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" fill="#1d4ed8">Respect the supported route.</text>
  <text x="600" y="534" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#1e3a8a">Verify through its connection.</text>

  <rect x="805" y="370" width="330" height="205" rx="20" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="970" y="418" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#7c2d12">Unknown or development entry</text>
  <text x="970" y="468" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" fill="#9a3412">Leave the entry unchanged.</text>
  <text x="970" y="501" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" fill="#9a3412">Report the conflict clearly.</text>
  <text x="970" y="534" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#7c2d12">Let a person decide.</text>

  <rect x="320" y="650" width="560" height="58" rx="29" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="600" y="687" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#334155">Repair known state. Defer to supported owners. Stop at uncertainty.</text>
</svg>
