<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Release evidence gate</title>
  <desc id="desc">A pipeline from source revision through verified artifact, public install, runtime checks, and safe uninstall.</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#475569"/></marker></defs>
  <rect width="1200" height="720" fill="#fbfaf7"/>
  <text x="600" y="72" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="700" fill="#111827">The release gate follows the artifact</text>
  <text x="600" y="114" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" fill="#4b5563">Every step produces evidence for the next decision.</text>

  <g font-family="Inter,Arial,sans-serif">
    <rect x="42" y="255" width="190" height="170" rx="18" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
    <text x="137" y="301" text-anchor="middle" font-size="23" font-weight="700" fill="#312e81">Known source</text>
    <text x="137" y="348" text-anchor="middle" font-size="17" fill="#4338ca">tag + revision</text>
    <text x="137" y="380" text-anchor="middle" font-size="17" fill="#4338ca">generated inputs</text>

    <path d="M232 340 L282 340" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="300" y="255" width="190" height="170" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <text x="395" y="301" text-anchor="middle" font-size="23" font-weight="700" fill="#1e3a8a">Verified artifact</text>
    <text x="395" y="348" text-anchor="middle" font-size="17" fill="#1d4ed8">signature</text>
    <text x="395" y="380" text-anchor="middle" font-size="17" fill="#1d4ed8">checksum</text>

    <path d="M490 340 L540 340" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="558" y="255" width="190" height="170" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
    <text x="653" y="301" text-anchor="middle" font-size="23" font-weight="700" fill="#7c2d12">Public install</text>
    <text x="653" y="348" text-anchor="middle" font-size="17" fill="#9a3412">place files</text>
    <text x="653" y="380" text-anchor="middle" font-size="17" fill="#9a3412">register services</text>

    <path d="M748 340 L798 340" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="816" y="255" width="190" height="170" rx="18" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
    <text x="911" y="301" text-anchor="middle" font-size="23" font-weight="700" fill="#065f46">Runtime proof</text>
    <text x="911" y="348" text-anchor="middle" font-size="17" fill="#047857">version + status</text>
    <text x="911" y="380" text-anchor="middle" font-size="17" fill="#047857">client reaches service</text>

    <path d="M1006 340 L1056 340" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="1074" y="255" width="90" height="170" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="1119" y="304" text-anchor="middle" font-size="19" font-weight="700" fill="#334155">Safe</text>
    <text x="1119" y="332" text-anchor="middle" font-size="19" font-weight="700" fill="#334155">uninstall</text>
    <text x="1119" y="382" text-anchor="middle" font-size="15" fill="#475569">data</text>
    <text x="1119" y="404" text-anchor="middle" font-size="15" fill="#475569">survives</text>
  </g>

  <rect x="280" y="540" width="640" height="72" rx="36" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="600" y="584" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#334155">Build evidence → install the deliverable → test the user's path</text>
</svg>
