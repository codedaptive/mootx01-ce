<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Separate request and approval channels</title>
  <desc id="desc">The agent requests sensitive access, a person approves through a separate channel, and a control service issues a temporary grant.</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#475569"/></marker></defs>
  <rect width="1200" height="720" fill="#fbfaf7"/>
  <text x="600" y="70" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="700" fill="#111827">Request and approval need different channels</text>
  <text x="600" y="112" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" fill="#4b5563">The actor asking for authority cannot also manufacture it.</text>

  <rect x="70" y="250" width="240" height="190" rx="22" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
  <text x="190" y="300" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700" fill="#312e81">AI agent</text>
  <text x="190" y="350" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" fill="#4338ca">requests access</text>
  <text x="190" y="382" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" fill="#4338ca">explains the need</text>
  <text x="190" y="414" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#312e81">cannot issue grant</text>

  <path d="M310 345 L448 345" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="378" y="324" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#475569">request</text>

  <rect x="470" y="220" width="260" height="250" rx="22" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
  <text x="600" y="270" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700" fill="#065f46">Control service</text>
  <text x="600" y="320" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" fill="#047857">accepts proof of presence</text>
  <text x="600" y="352" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" fill="#047857">issues bounded grant</text>
  <text x="600" y="384" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" fill="#047857">records the event</text>
  <text x="600" y="430" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#065f46">evaluates every read</text>

  <path d="M890 345 L752 345" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="821" y="324" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#475569">approval</text>

  <rect x="890" y="250" width="240" height="190" rx="22" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="1010" y="300" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700" fill="#7c2d12">Person</text>
  <text x="1010" y="350" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" fill="#9a3412">uses OS or secret</text>
  <text x="1010" y="382" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" fill="#9a3412">outside agent tools</text>
  <text x="1010" y="414" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#7c2d12">can revoke access</text>

  <rect x="330" y="570" width="540" height="62" rx="31" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="600" y="609" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" fill="#334155">One task, two channels, one bounded grant</text>
</svg>
