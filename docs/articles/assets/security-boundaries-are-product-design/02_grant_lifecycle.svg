<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Temporary grant lifecycle</title>
  <desc id="desc">A lifecycle from locked state through human approval and active access, returning to locked through expiry, restart, or manual lock.</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#475569"/></marker></defs>
  <rect width="1200" height="720" fill="#fbfaf7"/>
  <text x="600" y="70" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="700" fill="#111827">A grant should know how to end</text>
  <text x="600" y="112" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" fill="#4b5563">Expiry, restart, and manual lock all return to the safe default.</text>

  <circle cx="210" cy="350" r="115" fill="#f8fafc" stroke="#64748b" stroke-width="3"/>
  <text x="210" y="337" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="700" fill="#334155">Locked</text>
  <text x="210" y="376" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" fill="#475569">default ceiling</text>

  <path d="M325 350 L475 350" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="400" y="320" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#334155">human approval</text>

  <rect x="500" y="235" width="300" height="230" rx="30" fill="#ecfdf5" stroke="#34d399" stroke-width="3"/>
  <text x="650" y="292" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="700" fill="#065f46">Grant active</text>
  <text x="650" y="342" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" fill="#047857">read allowed to tier</text>
  <text x="650" y="376" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" fill="#047857">fixed expiry recorded</text>
  <text x="650" y="410" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" fill="#047857">use creates audit event</text>

  <path d="M800 350 L900 350" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="925" y="220" width="220" height="260" rx="22" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="1035" y="270" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="700" fill="#7c2d12">End conditions</text>
  <rect x="968" y="310" width="134" height="38" rx="9" fill="#ffedd5" stroke="#fdba74"/>
  <text x="1035" y="335" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#9a3412">fixed expiry</text>
  <rect x="968" y="365" width="134" height="38" rx="9" fill="#ffedd5" stroke="#fdba74"/>
  <text x="1035" y="390" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#9a3412">service restart</text>
  <rect x="968" y="420" width="134" height="38" rx="9" fill="#ffedd5" stroke="#fdba74"/>
  <text x="1035" y="445" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#9a3412">manual lock</text>

  <path d="M1035 480 C1035 610 210 610 210 480" stroke="#475569" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <text x="650" y="645" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#334155">Every ending removes authority; no background privilege survives.</text>
</svg>
