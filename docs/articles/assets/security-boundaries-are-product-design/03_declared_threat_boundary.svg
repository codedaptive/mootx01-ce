<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Declared agent threat boundary</title>
  <desc id="desc">Nested boundaries distinguish what the product controls through agent tools from what the operating system controls for local processes.</desc>
  <rect width="1200" height="760" fill="#fbfaf7"/>
  <text x="600" y="70" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="700" fill="#111827">State the boundary the product can enforce</text>
  <text x="600" y="112" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" fill="#4b5563">A precise promise is stronger than protection claimed at the wrong layer.</text>

  <rect x="90" y="160" width="1020" height="500" rx="30" fill="#fff7ed" stroke="#fb923c" stroke-width="3"/>
  <text x="600" y="205" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700" fill="#7c2d12">Operating-system boundary</text>
  <text x="600" y="238" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" fill="#9a3412">file permissions • device security • processes already acting as the local user</text>

  <rect x="210" y="285" width="780" height="305" rx="26" fill="#eff6ff" stroke="#60a5fa" stroke-width="3"/>
  <text x="600" y="332" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700" fill="#1e3a8a">Product boundary</text>
  <text x="600" y="365" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" fill="#1d4ed8">tool projection • recall ceiling • control endpoint • audit trail</text>

  <rect x="315" y="410" width="260" height="125" rx="18" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
  <text x="445" y="454" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#312e81">Agent session</text>
  <text x="445" y="488" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" fill="#4338ca">may request and recall</text>
  <text x="445" y="514" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" fill="#4338ca">cannot issue its grant</text>

  <rect x="625" y="410" width="260" height="125" rx="18" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
  <text x="755" y="454" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#065f46">Human control</text>
  <text x="755" y="488" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" fill="#047857">authenticates and grants</text>
  <text x="755" y="514" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" fill="#047857">can revoke immediately</text>

  <text x="600" y="708" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#334155">Tool controls defend the agent surface; the operating system defends the machine.</text>
</svg>
