<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Reviewable memory lifecycle</title>
  <desc id="desc">A model-written lesson begins unconfirmed and can be confirmed, corrected, contained, or withdrawn while preserving its history.</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#475569"/></marker></defs>
  <rect width="1200" height="760" fill="#fbfaf7"/>
  <text x="600" y="70" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="700" fill="#111827">A memory can change without losing its history</text>
  <text x="600" y="112" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" fill="#4b5563">Review creates several legitimate outcomes, not one approval button.</text>

  <rect x="400" y="170" width="400" height="120" rx="24" fill="#fff7ed" stroke="#fb923c" stroke-width="3"/>
  <text x="600" y="217" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700" fill="#7c2d12">Model-written lesson</text>
  <text x="600" y="254" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" fill="#9a3412">active record • origin known • unconfirmed</text>

  <path d="M600 290 L600 355" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="630" y="333" font-family="Inter,Arial,sans-serif" font-size="17" fill="#475569">review</text>

  <path d="M600 335 C430 335 275 375 190 420" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M600 335 C500 350 455 380 410 420" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M600 335 C700 350 745 380 790 420" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M600 335 C770 335 925 375 1010 420" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <rect x="65" y="440" width="250" height="160" rx="20" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
  <text x="190" y="488" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#065f46">Confirm</text>
  <text x="190" y="531" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" fill="#047857">keep active</text>
  <text x="190" y="561" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" fill="#047857">raise trust state</text>

  <rect x="350" y="440" width="250" height="160" rx="20" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="475" y="488" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#1e3a8a">Correct</text>
  <text x="475" y="531" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" fill="#1d4ed8">supersede content</text>
  <text x="475" y="561" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" fill="#1d4ed8">retain older version</text>

  <rect x="635" y="440" width="250" height="160" rx="20" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
  <text x="760" y="488" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#713f12">Contain</text>
  <text x="760" y="531" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" fill="#854d0e">quarantine lesson</text>
  <text x="760" y="561" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" fill="#854d0e">limit recall influence</text>

  <rect x="920" y="440" width="250" height="160" rx="20" fill="#fef2f2" stroke="#f87171" stroke-width="2"/>
  <text x="1045" y="488" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#7f1d1d">Withdraw</text>
  <text x="1045" y="531" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" fill="#991b1b">remove from active view</text>
  <text x="1045" y="561" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" fill="#991b1b">preserve audit trail</text>

  <rect x="305" y="660" width="590" height="58" rx="29" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="600" y="697" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#334155">Every outcome keeps enough evidence to explain what happened.</text>
</svg>
