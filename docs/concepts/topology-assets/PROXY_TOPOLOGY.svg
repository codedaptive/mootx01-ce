<svg viewBox="0 0 860 540" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono, monospace" font-size="12">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L8,3.5 Z" fill="#555"/>
    </marker>
    <marker id="arr-ok" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L8,3.5 Z" fill="#3ab4ff"/>
    </marker>
    <marker id="arr-bad" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L8,3.5 Z" fill="#ff5d6c"/>
    </marker>
    <marker id="arr-proxy" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L8,3.5 Z" fill="#ff8c00"/>
    </marker>
  </defs>

  <!-- ===== BACKGROUND PANELS ===== -->
  <!-- LEFT: TODAY -->
  <rect x="10" y="10" width="400" height="520" rx="10" fill="#0d1020" stroke="#272b36" stroke-width="1"/>
  <!-- RIGHT: AFTER -->
  <rect x="450" y="10" width="400" height="520" rx="10" fill="#0d1020" stroke="#272b36" stroke-width="1"/>

  <!-- Panel labels -->
  <text x="210" y="38" text-anchor="middle" fill="#ff5d6c" font-size="13" font-weight="700" letter-spacing="2">TODAY — BROKEN</text>
  <text x="650" y="38" text-anchor="middle" fill="#3ab4ff" font-size="13" font-weight="700" letter-spacing="2">AFTER PROXY — FIXED</text>

  <!-- ============================= LEFT PANEL ============================= -->

  <!-- Clients group label -->
  <text x="30" y="70" fill="#8a8aaa" font-size="10" letter-spacing="1.5">CLIENTS</text>

  <!-- HTTP clients (left) -->
  <rect x="20" y="78" width="120" height="32" rx="6" fill="#12162a" stroke="#3ab4ff" stroke-width="1"/>
  <text x="80" y="98" text-anchor="middle" fill="#c8c4bc" font-size="11">Claude Code</text>

  <rect x="20" y="118" width="120" height="32" rx="6" fill="#12162a" stroke="#3ab4ff" stroke-width="1"/>
  <text x="80" y="138" text-anchor="middle" fill="#c8c4bc" font-size="11">Cursor</text>

  <rect x="20" y="158" width="120" height="32" rx="6" fill="#12162a" stroke="#3ab4ff" stroke-width="1"/>
  <text x="80" y="178" text-anchor="middle" fill="#c8c4bc" font-size="11">Cline / Continue</text>

  <!-- Claude Desktop — broken -->
  <rect x="20" y="218" width="120" height="32" rx="6" fill="#2a1218" stroke="#ff5d6c" stroke-width="1.5"/>
  <text x="80" y="238" text-anchor="middle" fill="#f0eeea" font-size="11">Claude Desktop</text>

  <!-- Daemon box -->
  <rect x="195" y="78" width="190" height="130" rx="8" fill="#0d1020" stroke="#ff8c00" stroke-width="1.5"/>
  <text x="290" y="100" text-anchor="middle" fill="#ff8c00" font-size="11" font-weight="700">Resident Daemon</text>
  <text x="290" y="116" text-anchor="middle" fill="#8a8aaa" font-size="10">HTTP :4242</text>
  <text x="205" y="138" fill="#c8c4bc" font-size="10">▸ BrainPump</text>
  <text x="205" y="154" fill="#c8c4bc" font-size="10">▸ Intellectus sink</text>
  <text x="205" y="170" fill="#8a8aaa" font-size="10">  → stats.sqlite</text>
  <text x="205" y="190" fill="#3ab4ff" font-size="10">▸ estate.sqlite  ✓</text>

  <!-- stats.sqlite box -->
  <rect x="200" y="230" width="80" height="28" rx="5" fill="#090b14" stroke="#3ab4ff" stroke-width="1"/>
  <text x="240" y="248" text-anchor="middle" fill="#3ab4ff" font-size="10">stats.sqlite</text>

  <!-- moot-mgr -->
  <rect x="300" y="230" width="80" height="28" rx="5" fill="#090b14" stroke="#ff8c00" stroke-width="1"/>
  <text x="340" y="248" text-anchor="middle" fill="#ff8c00" font-size="10">moot-mgr</text>

  <!-- Ghost stdio process — the problem -->
  <rect x="195" y="285" width="190" height="80" rx="8" fill="#1a0a0a" stroke="#ff5d6c" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="290" y="308" text-anchor="middle" fill="#ff5d6c" font-size="11" font-weight="700">mootx01 serve (stdio)</text>
  <text x="205" y="328" fill="#8a8aaa" font-size="10">✗ no telemetry sink</text>
  <text x="205" y="344" fill="#8a8aaa" font-size="10">✗ no ARIA_MCP_STATS_STORE</text>
  <text x="205" y="358" fill="#ff5d6c" font-size="10">✗ 2nd writer to estate</text>

  <!-- estate.sqlite — shared, two writers -->
  <rect x="215" y="390" width="150" height="28" rx="5" fill="#2a1218" stroke="#ff5d6c" stroke-width="1.5"/>
  <text x="290" y="408" text-anchor="middle" fill="#ff5d6c" font-size="10">estate.sqlite  ← 2 WRITERS</text>

  <!-- Problem label -->
  <rect x="195" y="435" width="190" height="40" rx="6" fill="#1a0a0a" stroke="#ff5d6c" stroke-width="1"/>
  <text x="290" y="452" text-anchor="middle" fill="#ff5d6c" font-size="10" font-weight="700">Desktop invisible to moot-mgr</text>
  <text x="290" y="467" text-anchor="middle" fill="#8a8aaa" font-size="10">data changes, monitor blind</text>

  <!-- LEFT ARROWS -->
  <!-- HTTP clients → daemon -->
  <line x1="140" y1="94" x2="194" y2="130" stroke="#3ab4ff" stroke-width="1.5" marker-end="url(#arr-ok)"/>
  <line x1="140" y1="134" x2="194" y2="143" stroke="#3ab4ff" stroke-width="1.5" marker-end="url(#arr-ok)"/>
  <line x1="140" y1="174" x2="194" y2="155" stroke="#3ab4ff" stroke-width="1.5" marker-end="url(#arr-ok)"/>
  <text x="155" y="125" fill="#3ab4ff" font-size="9">HTTP</text>

  <!-- daemon → stats -->
  <line x1="260" y1="208" x2="255" y2="229" stroke="#3ab4ff" stroke-width="1" marker-end="url(#arr-ok)"/>
  <!-- stats → mgr -->
  <line x1="280" y1="244" x2="299" y2="244" stroke="#3ab4ff" stroke-width="1" marker-end="url(#arr-ok)"/>
  <!-- desktop → spawn ghost -->
  <line x1="80" y1="250" x2="80" y2="318" stroke="#ff5d6c" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="80" y1="318" x2="194" y2="318" stroke="#ff5d6c" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-bad)"/>
  <text x="28" y="290" fill="#ff5d6c" font-size="9">spawns</text>
  <!-- ghost → estate -->
  <line x1="290" y1="365" x2="290" y2="389" stroke="#ff5d6c" stroke-width="1.5" marker-end="url(#arr-bad)"/>
  <!-- daemon → estate (also) -->
  <line x1="290" y1="208" x2="290" y2="295" stroke="#3ab4ff" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="295" y="255" fill="#8a8aaa" font-size="9">writes</text>

  <!-- ============================= RIGHT PANEL ============================= -->

  <!-- Clients -->
  <text x="470" y="70" fill="#8a8aaa" font-size="10" letter-spacing="1.5">CLIENTS</text>

  <rect x="460" y="78" width="120" height="32" rx="6" fill="#12162a" stroke="#3ab4ff" stroke-width="1"/>
  <text x="520" y="98" text-anchor="middle" fill="#c8c4bc" font-size="11">Claude Code</text>

  <rect x="460" y="118" width="120" height="32" rx="6" fill="#12162a" stroke="#3ab4ff" stroke-width="1"/>
  <text x="520" y="138" text-anchor="middle" fill="#c8c4bc" font-size="11">Cursor</text>

  <rect x="460" y="158" width="120" height="32" rx="6" fill="#12162a" stroke="#3ab4ff" stroke-width="1"/>
  <text x="520" y="178" text-anchor="middle" fill="#c8c4bc" font-size="11">Cline / Continue</text>

  <!-- Desktop — fixed -->
  <rect x="460" y="218" width="120" height="32" rx="6" fill="#0d1a12" stroke="#3ab4ff" stroke-width="1.5"/>
  <text x="520" y="238" text-anchor="middle" fill="#f0eeea" font-size="11">Claude Desktop</text>

  <!-- Proxy box -->
  <rect x="460" y="270" width="120" height="50" rx="6" fill="#0d1020" stroke="#ff8c00" stroke-width="1.5"/>
  <text x="520" y="291" text-anchor="middle" fill="#ff8c00" font-size="11" font-weight="700">mootx01 proxy</text>
  <text x="520" y="308" text-anchor="middle" fill="#8a8aaa" font-size="9">--http :4242</text>
  <text x="520" y="320" text-anchor="middle" fill="#8a8aaa" font-size="9">URLSession POST</text>

  <!-- Daemon box (right) -->
  <rect x="635" y="78" width="190" height="200" rx="8" fill="#0d1020" stroke="#ff8c00" stroke-width="1.5"/>
  <text x="730" y="100" text-anchor="middle" fill="#ff8c00" font-size="11" font-weight="700">Resident Daemon</text>
  <text x="730" y="116" text-anchor="middle" fill="#8a8aaa" font-size="10">HTTP :4242</text>
  <text x="645" y="138" fill="#c8c4bc" font-size="10">▸ BrainPump</text>
  <text x="645" y="154" fill="#c8c4bc" font-size="10">▸ Intellectus sink</text>
  <text x="645" y="170" fill="#8a8aaa" font-size="10">  → stats.sqlite</text>
  <text x="645" y="190" fill="#3ab4ff" font-size="10">▸ estate.sqlite  ✓</text>
  <text x="645" y="210" fill="#6cc28e" font-size="10">▸ Desktop calls fire here</text>
  <text x="645" y="226" fill="#6cc28e" font-size="10">  telemetry ✓  1 writer ✓</text>
  <text x="645" y="254" fill="#ff8c00" font-size="10">ALL clients, one process</text>

  <!-- stats.sqlite (right) -->
  <rect x="640" y="300" width="80" height="28" rx="5" fill="#090b14" stroke="#3ab4ff" stroke-width="1"/>
  <text x="680" y="318" text-anchor="middle" fill="#3ab4ff" font-size="10">stats.sqlite</text>

  <!-- moot-mgr (right) -->
  <rect x="740" y="300" width="80" height="28" rx="5" fill="#090b14" stroke="#ff8c00" stroke-width="1"/>
  <text x="780" y="318" text-anchor="middle" fill="#ff8c00" font-size="10">moot-mgr</text>

  <!-- estate.sqlite — one writer -->
  <rect x="650" y="350" width="160" height="28" rx="5" fill="#0d1a12" stroke="#3ab4ff" stroke-width="1.5"/>
  <text x="730" y="368" text-anchor="middle" fill="#3ab4ff" font-size="10">estate.sqlite  — 1 WRITER ✓</text>

  <!-- Result label -->
  <rect x="635" y="400" width="190" height="40" rx="6" fill="#0d1a12" stroke="#3ab4ff" stroke-width="1"/>
  <text x="730" y="417" text-anchor="middle" fill="#3ab4ff" font-size="10" font-weight="700">Desktop visible to moot-mgr</text>
  <text x="730" y="432" text-anchor="middle" fill="#8a8aaa" font-size="10">all events captured, 1 writer</text>

  <!-- RIGHT ARROWS -->
  <!-- HTTP clients → daemon -->
  <line x1="580" y1="94" x2="634" y2="130" stroke="#3ab4ff" stroke-width="1.5" marker-end="url(#arr-ok)"/>
  <line x1="580" y1="134" x2="634" y2="143" stroke="#3ab4ff" stroke-width="1.5" marker-end="url(#arr-ok)"/>
  <line x1="580" y1="174" x2="634" y2="155" stroke="#3ab4ff" stroke-width="1.5" marker-end="url(#arr-ok)"/>
  <text x="595" y="125" fill="#3ab4ff" font-size="9">HTTP</text>

  <!-- Desktop → proxy (stdio) -->
  <line x1="520" y1="250" x2="520" y2="269" stroke="#ff8c00" stroke-width="1.5" marker-end="url(#arr-proxy)"/>
  <text x="526" y="264" fill="#ff8c00" font-size="9">stdio</text>

  <!-- proxy → daemon (HTTP) -->
  <line x1="580" y1="295" x2="634" y2="200" stroke="#ff8c00" stroke-width="1.5" marker-end="url(#arr-proxy)"/>
  <text x="588" y="255" fill="#ff8c00" font-size="9">HTTP</text>

  <!-- daemon → stats -->
  <line x1="700" y1="278" x2="693" y2="299" stroke="#3ab4ff" stroke-width="1" marker-end="url(#arr-ok)"/>
  <!-- stats → mgr -->
  <line x1="720" y1="314" x2="739" y2="314" stroke="#3ab4ff" stroke-width="1" marker-end="url(#arr-ok)"/>
  <!-- daemon → estate -->
  <line x1="730" y1="278" x2="730" y2="349" stroke="#3ab4ff" stroke-width="1" marker-end="url(#arr-ok)"/>

  <!-- moot-mgr reads -->
  <text x="460" y="502" fill="#8a8aaa" font-size="10">reads</text>
  <line x1="780" y1="328" x2="780" y2="399" stroke="#ff8c00" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arr-proxy)"/>

  <!-- Legend -->
  <line x1="20" y1="512" x2="50" y2="512" stroke="#3ab4ff" stroke-width="1.5"/>
  <text x="55" y="516" fill="#8a8aaa" font-size="10">HTTP / monitored</text>
  <line x1="145" y1="512" x2="175" y2="512" stroke="#ff8c00" stroke-width="1.5"/>
  <text x="180" y="516" fill="#8a8aaa" font-size="10">proxy path</text>
  <line x1="250" y1="512" x2="280" y2="512" stroke="#ff5d6c" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="285" y="516" fill="#8a8aaa" font-size="10">broken / removed</text>
</svg>
