<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1280" viewBox="0 0 1440 1280" role="img" aria-labelledby="title description">
<title id="title">MOOTx01 topology — diagram revision 1.2.0</title>
<desc id="description">MOOTx01 1.1 implementation: the resident daemon contains the MCP server transport and adapter, stable first-party interface and ProductDock. Independent MCP and stable first-party adapters share typed ARIA operations in process; stdio is an alternate hosting mode. Licensed ProductDock uses a separate stateful JSON-RPC Unix socket. macOS uses a resident estate owner; iOS retains its embedded owner. ARIA writes enter GeniusLocusKit; permitted store reads remain distinct. Rust first-party runtime, protected privacy settings and browser hosting remain pending.</desc>
<metadata>Diagram version: 1.2.0; product line: 1.1; date: 2026-09-11; source: 175382a8c; previous drawing: mootx01_topology_v1.0.svg</metadata>
