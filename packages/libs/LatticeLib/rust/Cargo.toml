[package]
name = "lattice-lib"
version = "0.1.0"
edition = "2021"
description = "FDC runtime encoder — Rust port of LatticeLib (Swift leads, Rust follows)"

# This crate is a library + integration test. There is no Metal / BLAS / NEON
# dimension for the FDC algorithm: it is a pure string/bag computation. The
# conformance contract is Swift-scalar <-> Rust-scalar only. See the
# CONFORMANCE section in src/lib.rs for the rationale.

[lib]
name = "lattice_lib"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"
substrate-kernel = { path = "../../SubstrateKernel/rust" }
# moot-product-identity: the novel-token pool's two folder names and its two
# base directories — `LATTICE_FOLDER` under the Apple container, and the
# configuration directory on Linux and Windows — resolved the same way every
# product process resolves them.
moot-product-identity = { path = "../../MootProductIdentity/rust" }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
