[package]
name = "adornment-lib"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Dream-time adornment generation and certification for MOOTx01. Pure functions, the resident GoldMiner engine seam (quantized in-process LLM), and the MOOT_MINT_CMD command seam. Ports AdornmentLib/Sources/AdornmentLib/."
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "adornment_lib"
path = "src/lib.rs"

# No kit dependencies — AdornmentLib is BELOW GLK in the dependency graph.
#
# External crates (C-1 per-crate approval, Bob 2026-08-26 — the gold-miner
# directive): the Rust port must carry its own small resident local engine,
# the equivalent of Swift's Apple on-device model. candle is the same
# inference stack already approved for the embedding provider backend;
# pins match the benchmark minter so both compile one candle.
[dependencies]
candle-core = { version = "=0.9.2" }
candle-nn = { version = "=0.9.2" }
candle-transformers = { version = "=0.9.2" }
tokenizers = { version = "0.21" }
libc = "0.2"
# serde_json: the minter-recipe output normalizer's Json branch (Bob's
# text|json payload ruling, 2026-08-26). Structured payloads are parsed
# with a real parser per the no-regex-on-structured-files rule; already
# a transitive dependency of the candle stack above.
serde_json = "1"

# Apple builds light the Metal arm automatically (Bob ruling 2026-08-29):
# on macOS the candle crates compile with their metal kernels, and the
# engine's device selection prefers Metal with a runtime CPU fallback.
# Product Rust targets (Windows/Linux) never see this block and stay on
# the CPU path — the measured CPU numbers remain the product truth there.
[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "=0.9.2", features = ["metal"] }
candle-nn = { version = "=0.9.2", features = ["metal"] }
candle-transformers = { version = "=0.9.2", features = ["metal"] }

[features]
# metal: force candle's Metal kernels on for a NON-macOS build that
# somehow has them (not a supported product shape). On macOS the target
# block above already enables them; this feature remains for explicit
# harness builds and compatibility with existing build scripts.
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]

[dev-dependencies]
