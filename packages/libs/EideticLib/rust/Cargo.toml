[package]
name = "eidetic-lib"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Deterministic text-to-anchor utility: pass a term, get back a UDC code and an optional Wikidata Q-ID. Ships with a frozen reference snapshot of UDC (CC-BY-SA 3.0) and Wikidata (CC0). Conformance-gated against the Swift port at EideticLib/Sources/EideticLib/."
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "eidetic_lib"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"
rust-stemmers = "1"
aho-corasick = "1"
