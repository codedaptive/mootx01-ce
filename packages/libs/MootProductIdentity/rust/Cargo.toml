[package]
name = "moot-product-identity"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "The product's identity strings, spelled once: configuration folder, logging subsystem, service labels, Keychain services, Apple identifiers, preference keys and queue labels. Twin of the Swift MootProductIdentity library; both ports are pinned by Fixtures/product_identity.json."
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "moot_product_identity"
path = "src/lib.rs"

[dependencies]
# serde_json parses `<config dir>/config.json` in ProductSettings::load, the
# production settings path shared by the daemon and moot-mgr, and the fixture
# parity test reads it too. The port's Swift twin uses Foundation's
# JSONSerialization; serde_json is the Rust port's JSON parser everywhere.
serde_json = { version = "1" }
