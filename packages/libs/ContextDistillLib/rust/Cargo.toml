[package]
name = "context-distill-lib"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Offline deterministic distillation classifier and converter. Rust port of record_shape_classifier.py and distill_plus_converter.py; conformance-gated against shared oracle vectors in Tests/ContextDistillLibTests/Vectors/."
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "context_distill_lib"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
substrate-kernel = { path = "../../SubstrateKernel/rust" }
moot-product-identity = { path = "../../MootProductIdentity/rust" }

[dev-dependencies]
serde_json = "1"
