[package]
name = "neuron-kit"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "The algorithms layer of the MOOTx01 substrate. Composes EideticLib's deterministic text-to-anchor lookup and wraps it in substrate-shaped LatticeAnchorInference records that carry the provenance enrichment_status bit transition per cookbook section 2.5. Conformance-gated against the Swift port at NeuronKit/Sources/NeuronKit. Per DESIGN_CONSTRAINTS.md C-1, no external runtime dependencies; ML capabilities live above the substrate, not within it."
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "neuron_kit"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eidetic-lib = { path = "../../../libs/EideticLib/rust" }
# lattice-lib supplies the UAX #29 tokeniser (tokenizer::tokenize) and the
# deterministic HMM/Viterbi novel-token tagger (word_class::hmm_tag). Both
# are used by hmm_feature_extractor.rs, the production distillation feature
# extractor. The HMM path is byte-identical Swift↔Rust (LatticeLib contract,
# cookbook §2.2). Citation: mission feat/distillation-hmm-extractor.
lattice-lib = { path = "../../../libs/LatticeLib/rust" }
# IntellectusLib is the zero-dependency telemetry leaf. NeuronKit emits
# self-report metrics at hybrid recall, dreaming cycle, and tournament
# boundaries (MANAGER_1.0_PLAN §4 P2 self-report coverage). When
# monitoring is off (the default), the report! macro expands to a single
# AtomicBool::load + branch — zero allocation, no clock. Layering-safe:
# intellectus-lib depends only on std.
intellectus-lib = { path = "../../../libs/IntellectusLib/rust" }
# EngramLib supplies the typed `Engram` (Fingerprint256) and its Hamming
# `distance` primitive. NEURONKIT_SPEC § 4.1 step 4's standalone MMR rerank
# (`mmr_rank` / `MMREngine`) derives relevance and inter-candidate
# similarity from that distance — the Rust port of the Swift MMRRank.swift.
engram-lib = { path = "../../../libs/EngramLib/rust" }
# The migration recall-fidelity benchmark and tournament (NEURONKIT_SPEC
# § 4.7) score COW branches. GLK owns the branch surface; NeuronKit consumes
# it, mirroring the Swift NeuronKit `import GeniusLocusKit` / `import LocusKit`
# in BenchmarkAlgorithm.swift / Tournament.swift / BranchOps.swift. Acyclic:
# GLK and LocusKit do not depend on NeuronKit.
genius-locus-kit = { path = "../../GeniusLocusKit/rust" }
locus-kit = { path = "../../LocusKit/rust" }
# T5 (ADR-021 Decision 7): ensure_scheduler mounts the shared per-estate
# queue.sqlite signals lane (PersistenceKitBackend + DrainLease) on SQLite
# estates, and a transient in-memory backend on non-SQLite estates. Mirrors the
# Swift SignalAPI.ensureScheduler backend selection. Layering: neuron-kit
# (composition) → queuekit (substrate) does NOT invert; queuekit has no
# dependency on neuron-kit.
queuekit = { path = "../../QueueKit/rust", features = ["persistencekit"] }
# Keystones (Lens 1, Structure) surfaces SubstrateML's gated
# EigenvalueCentrality as a NeuronKit reasoning function — the deep matrix
# math lives in SubstrateML; NeuronKit shapes it into a substrate result.
substrate-ml = { path = "../../../libs/SubstrateML/rust" }
# FeelsLike (Lens 7) surfaces SubstrateML's partial_state_recall, whose
# row id + fingerprint types (RowId, Fingerprint256) come from SubstrateTypes.
substrate-types = { path = "../../../libs/SubstrateTypes/rust" }
# uuid: the AutonomicGovernor formats EstateHandle estate_uuid bytes as a
# UUID string (via Uuid::from_bytes) when constructing estate IDs for topology
# snapshots and telemetry event tags. Promoted from dev-dependencies when the
# governor moved from AriaMcpKit to NeuronKit.
uuid = { version = "1", features = ["v4"] }
# T5 (ADR-021 Decision 7): ensure_scheduler selects the SQLite vs in-memory
# signals queue backend using persistence_kit::sqlite::SqliteStorage and
# persistence_kit::inmemory::InMemoryStorage. Promoted from dev-dependencies
# to production dep because autonomic_governor.rs uses both in non-test code.
# Layering: neuron-kit (composition) → persistence-kit (substrate) does NOT
# invert; persistence-kit has no dependency on neuron-kit.
persistence-kit = { path = "../../PersistenceKit/rust" }

[dev-dependencies]

# uuid is also a production dep (AutonomicGovernor formats estate UUIDs).
# Listed separately in [dependencies] above; the dev-dependencies entry is
# kept for any test helpers that need v4 generation.
uuid = { version = "1", features = ["v4"] }
