[package]
name = "vault-kit"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "VaultKit — bidirectional bridge between a MOOT estate and a human-readable Markdown vault. Rust port of the Swift VaultKit package."
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "vault_kit"
path = "src/lib.rs"

# Dependency rationale:
#   genius-locus-kit: provides EstateCoordinator, EstateHandle, CaptureFrame,
#     RecallFrame, VerbDispatchError — the verb surface VaultBridge calls.
#   locus-kit: provides Drawer, Tunnel, TunnelCaptureFrame,
#     TunnelKind, TunnelOriginClass — value types DrawerMapping produces.
#   uuid: FNV-1a 128-bit lineageID is packed into a uuid::Uuid (byte-identical
#     to the Swift UUID produced by DrawerMapping.lineageID(forStableSourceKey:)).
#     The "serde" feature decodes the `mootID` key of the canonical corpus
#     JSON; encoding is custom (uppercase, matching Foundation's UUID).
#   serde / serde_json: the versioned canonical JSON corpus document per
#     data-movement privacy tiers ("the JSON is the payload"). Both crates were
#     already in vault-kit's transitive graph (via genius-locus-kit →
#     corpus-kit); declared explicitly here per the mission's Blast Radius
#     Report (VK_IR_01) and in-repository dependency direction.
#
# Layering: vault-kit (above GLK) → genius-locus-kit → locus-kit.
# No inversion. Per in-repository dependency direction.
#   rusqlite: read-only access to MemPalace's foreign SQLite stores
#     (ChromaDB `chroma.sqlite3` + `knowledge_graph.sqlite3`) in
#     MemPalaceChromaAdapter. Version and `bundled` feature match
#     persistence-kit's existing declaration so one SQLite build rides the
#     workspace. PersistenceKit's public surface cannot open a foreign
#     third-party schema; reading an external tool's file format is codec
#     territory and belongs to the adapter (same boundary as
#     ExchangeAdapter's JSON parsing). Recorded in the lane's field-mapping
#     contract (docs/reference/VAULTKIT_INTERFACE.md, MemPalace adapter).
[dependencies]
genius-locus-kit = { path = "../../GeniusLocusKit/rust" }
rusqlite = { version = "0.31", features = ["bundled"] }
locus-kit = { path = "../../LocusKit/rust" }
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Dev-only: `provision_estate` in charter_and_provenance.rs tests requires
# InMemoryStorage (persistence-kit) and EmbeddingModelConfig (corpus-kit) to
# call EstateCoordinator::provision. These are transitive deps of genius-locus-kit
# but must be declared explicitly for integration test use.
[dev-dependencies]
corpus-kit = { path = "../../CorpusKit/rust" }
persistence-kit = { path = "../../PersistenceKit/rust" }
