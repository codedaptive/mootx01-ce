[package]
name = "cognition-kit"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "CognitionKit — the behaviour-recipe layer of the MOOTx01 substrate (Rust port). Recipes sequence NeuronKit reasoning and GeniusLocusKit verbs; this crate ports the deterministic decision core (capability gate, error model, recipe catalog, migration ranking) AND the live recipe execution: a real RecipeSubstrate adapter binding the migration-benchmark orchestration to the GeniusLocusKit COW branch verbs + NeuronKit benchmark. Conformance-gated against the Swift reference at CognitionKit/Sources/CognitionKit. Per CLAUDE.md neither port leads."
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "cognition_kit"
path = "src/lib.rs"

# Standalone crate (no top-level Cargo workspace in this repo; sibling
# kits are each standalone crates). The deterministic decision core has
# no external runtime dependency. serde mirrors the Swift Codable
# RecipeDescriptor so the catalog's wire shape can be round-tripped and
# gated identically across ports.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The live recipe execution sequences GLK COW branch verbs + NeuronKit's
# benchmark over the real LocusKit estate, mirroring the Swift CognitionKit
# imports (GeniusLocusKit + NeuronKit + LocusKit). Acyclic: none of these
# depend on CognitionKit.
genius-locus-kit = { path = "../../GeniusLocusKit/rust" }
neuron-kit = { path = "../../NeuronKit/rust" }
locus-kit = { path = "../../LocusKit/rust" }
# IntellectusLib is the zero-dependency telemetry leaf.
# CognitionKit emits self-report metrics at recipe-run boundaries
# (cp-cognitionkit-report P2 self-report coverage;
# DECISION_LIFT_PACKAGE_SWIFT_RULE_2026-05-28). When monitoring is
# off (the default), every report!() call is a single atomic load +
# branch — zero allocation. IntellectusLib depends on nothing; layering
# is safe. Mirrors the Swift CognitionKit Package.swift dependency.
intellectus-lib = { path = "../../../libs/IntellectusLib/rust" }
# SubstrateML provides the ARM engine (mine_association_rules, MiningThresholds)
# consumed by association_rules_recipe.rs.
substrate-ml = { path = "../../../libs/SubstrateML/rust" }
# The gated promotion (confirm_migration_promotion) parses the report's
# estate-free String branch ids back to the typed BranchId to drive
# glk_promote_branch over the coordinator's retained branch registry.
uuid = { version = "1", features = ["v4"] }
# FeelsLike maps drawer ids to partial_state_recall's RowId(u128).
substrate-types = { path = "../../../libs/SubstrateTypes/rust" }

[dev-dependencies]
# Test-only: building a parent estate to derive branches from.
persistence-kit = { path = "../../PersistenceKit/rust" }
# Telemetry tests install a CapturingSink and assert emit counts/tags.
# IntellectusLib is a regular dependency but the test uses its public API
# (Intellectus::install, set_enabled) which requires the dev import.
# (Already in [dependencies]; listed here for documentation clarity only —
# Cargo resolves it from [dependencies] automatically for integration tests.)

# Shared-vector conformance integration test (BYCOPY_MIGRATION_001).
# Reads Tests/CognitionKitTests/Fixtures/cognition_vectors.json and asserts
# the Rust migration_ranking functions reproduce the Swift-recorded values.
[[test]]
name = "cognition_conformance"
path = "tests/cognition_conformance.rs"

# CognitionKit P2 self-report telemetry integration tests.
# Mirrors CognitionKitTelemetryTests.swift §1–§4.
# cp-cognitionkit-report; DECISION_LIFT_PACKAGE_SWIFT_RULE_2026-05-28.
[[test]]
name = "cognitionkit_telemetry_tests"
path = "tests/cognitionkit_telemetry_tests.rs"
