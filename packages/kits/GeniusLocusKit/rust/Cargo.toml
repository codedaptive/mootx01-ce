[package]
name = "genius-locus-kit"
version = "0.35.0"
edition = "2021"
rust-version = "1.75"
description = "Rust port scaffold of GeniusLocusKit — the composition layer that coordinates N estates on one device. Parity-gated against the Swift reference."
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "genius_locus_kit"
path = "src/lib.rs"

[dependencies]
# R10 (2026-06-20): EideticLib provides the canonical cross-leg sentence
# segmenter (eidetic_lib::segmenter::sentences). The distill_items_sweep
# in coordinator.rs previously used an ad-hoc split(". ") approximation;
# replacing it with the real segmenter aligns Rust intra-item distillation
# eligibility with Swift's EideticLib.sentencesByDelimiter path, fixing
# the parity gap where identical content produced 0 factoids on Rust but 1
# on Swift. Layering: genius-locus-kit (composition) → eidetic-lib
# (sentence utility lib) does NOT invert — eidetic-lib has no dependency
# on GeniusLocusKit. eidetic-lib already depends on lattice-lib, which
# GLK also depends on, so this adds no new transitive external crate.
# Per in-repository dependency direction (Rust no-inversion rule).
eidetic-lib = { path = "../../../libs/EideticLib/rust" }
# F18.3 (2026-05-27): GLK now depends on SubstrateLib so the unified
# audit log can consume the canonical SHA-256 content-hash and HLC
# rather than hold byte-compatible local mirrors. The GLK-01/03 missions
# deferred this dependency ("no new dependencies"); the local types were
# always built byte-compatible anticipating exactly this wiring.
substrate-kernel = { path = "../../../libs/SubstrateKernel/rust" }
substrate-types = { path = "../../../libs/SubstrateTypes/rust" }
# SubstrateML (Layer 3 algorithms) is required so `MatrixTier::rebuild_temporal`
# can delegate to `temporal_causality_fold::fold` — the canonical T-matrix engine
# (cookbook §6.4). Mirrors the Swift dependency added 2026-06-04 per
# hourly temporal-matrix scheduling. Layering: GeniusLocusKit
# (composition) → SubstrateML (algorithms) does NOT invert.
substrate-ml = { path = "../../../libs/SubstrateML/rust" }
# The coordinator, handle, and lattice-overlap fan-out logic remain pure
# Rust; LocusKit-equivalent recall is mocked through a trait in those
# surfaces. The COW branch surface (src/branches), by contrast, IS the
# downstream mission that wires the real Rust LocusKit estate: a branch is
# a fresh in-memory `locus_kit::Estate` and branching is pure capture/recall
# over it, so it binds the real port directly (acyclic — LocusKit does not
# depend on GLK). persistence-kit supplies the in-memory `Storage` backend.
locus-kit = { path = "../../LocusKit/rust" }
persistence-kit = { path = "../../PersistenceKit/rust" }
# GLK_RAG_WIRING_001: VectorKit and CorpusKit are the RAG and vector
# seam dependencies. VectorSimilaritySignal queries VectorStore.find_nearest
# for row-pair proximity; ExternalCorpus.hybrid_recall routes through
# Corpus.recall for hybrid BM25+vector retrieval.
vectorkit = { path = "../../VectorKit/rust" }
corpus-kit = { path = "../../CorpusKit/rust" }
# Dual-Path Intake (G7): the per-estate encode queue is a real QueueKit
# mounted on the in-memory PersistenceKit backend (D-B), so GLK depends on
# queuekit with the persistencekit feature. Mirrors the Swift
# `import QueueKit` in EncodeIntake.swift. Layering: genius-locus-kit
# (composition) → queuekit (substrate) does NOT invert.
# Per in-repository dependency direction (Rust no-inversion rule).
queuekit = { path = "../../QueueKit/rust", features = ["persistencekit"] }
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# Crypto hygiene: zeroize scope keys on drop and on revoke. This is the
# companion crate to aes-gcm (already a transitive dep via PersistenceKit);
# adding it as a direct dep makes the dependency explicit and enables the
# Zeroizing<> wrapper on mediated_keys storage.
# C-1 rationale: crypto hygiene companion to the approved aes-gcm crate.
# See the Rust AES-GCM seam.
zeroize = "1"
# D9 grant signature verification: decode the source estate's base64-encoded
# Ed25519 public key from the manifest before calling convergence_kit::verify_signature.
# Version matches the base64 = "0.22" used by locus-kit (same transitive dep, made
# explicit here per Rust best practice — don't rely on transitive deps in own code).
base64 = "0.22"
# IntellectusLib is the zero-dependency telemetry floor (GLK_ROLLUPS_001).
# GeniusLocusKit emits per-estate rollup metrics at open/close/provision/quiesce/drain
# and at the verb-error boundary. Off-path cost: single AtomicBool::load(Acquire) +
# branch — zero allocation, no lock. Results byte-identical when disabled.
# Layering: genius-locus-kit (composition) → intellectus-lib (floor). No inversion.
# Per in-repository dependency direction (Rust equivalent: no inversion rule).
intellectus-lib = { path = "../../../libs/IntellectusLib/rust" }
# ConvergenceKit: sync-backend abstraction. GeniusLocusKit stores the active
# SyncEngine per estate and exposes sync_state_token so ARIA surfaces can
# report honest sync status. Layering: genius-locus-kit (composition) →
# convergence-kit (sync tier) does NOT invert. convergence-kit has no
# dependency on genius-locus-kit.
# Per in-repository dependency direction (Rust no-inversion rule).
convergence-kit = { path = "../../ConvergenceKit/rust" }
# EngramLib: promoted from dev-dep to production dep by DG3 (findNearestDistilled).
# The `find_nearest_distilled` function takes `&Engram` in its public signature —
# the probe is a structural fingerprint computed by DistillationPipeline — so
# Engram must be nameable in production code. Engram was already a transitive dep
# via vectorkit → engram-lib; this entry makes the dependency explicit per the
# production signature. Layering: genius-locus-kit (composition) → engram-lib
# (substrate primitive) does NOT invert. Per in-repository dependency direction.
engram-lib = { path = "../../../libs/EngramLib/rust" }
# One-door FDC classification seam (fix/fdc-capture-seam): capture_with_mode
# now classifies the lattice anchor via Fdc::encode_anchor when the incoming
# frame carries the unclassified sentinel "000" and content is non-empty — the
# single place every capture path (file_memory, vault import, branch promotion)
# runs FDC. Layering: genius-locus-kit (composition) → lattice-lib (algorithm
# substrate) does NOT invert (lattice-lib has no dependency on GLK).
# Per in-repository dependency direction (Rust no-inversion rule).
lattice-lib = { path = "../../../libs/LatticeLib/rust" }

[features]
# test-seams: exposes EstateCoordinator::inject_vector_hamming_error and
# inject_embed_error for P1 degradation force-tests in the integration test suite
# (tests/recall_scored_parity.rs GROUP E). Compiled out of the production binary.
# Also enables locus-kit/test-seams so the LocusKit recall internal-read fault
# seam (Estate::set_test_force_internal_read_error) is reachable from GLK
# integration tests that drive recall through the RecallDirector (P0-5 sites
# 1-5). Without this, the dependency crate's `test` cfg does NOT apply to GLK's
# integration tests and the seam method would be absent.
test-seams = ["locus-kit/test-seams", "corpus-kit/canonical-test-seams"]

[dev-dependencies]
# P6 scale-qualification driver (tests/scale_qualification.rs, #[ignore],
# env-gated): raw read-only metrics probe (page/freelist counts, dbstat
# per-table bytes) on the qualification clone. Dev-dep only; rusqlite is
# already in the tree via persistence-kit. Version matches persistence-kit's.
rusqlite = { version = "0.31", features = ["bundled-sqlcipher-vendored-openssl"] }
# test-seams exposes LocusKit's test-only orphan-seal failure hook used by
# tests/expunge_vector_orphan.rs E8. The production dependency above carries
# no features, so this remains test-only wiring.
locus-kit = { path = "../../LocusKit/rust", features = ["test-seams"] }
# I4 test: provision with the production default ensemble (5 untrained signals)
# to prove cluster assignment works on a fresh estate. The real providers live
# in corpus-kit-providers (the factory layer above corpus-kit core). dev-dep
# only; not linked into the production binary. Layering: GLK → corpus-kit-providers
# is acyclic — providers depend on corpus-kit core, not on GLK.
corpus-kit-providers = { path = "../../CorpusKit/rust-providers" }
# FED-SIG-01 grant-signature tests: LocalIdentity::from_secret / ::sign /
# ::public_key_bytes to build and verify Ed25519-signed grants for D9 tests.
# convergence-kit is already a production dep; the dev-dep makes it directly
# nameable in tests/ without requiring the caller to route through
# genius_locus_kit's public surface. No layering inversion.
convergence-kit = { path = "../../ConvergenceKit/rust" }
# FED-SIG-01 tests: base64 decode in the test harness (matches production dep version).
base64 = "0.22"

# These integration-test binaries call EstateCoordinator seams gated behind
# `#[cfg(any(test, feature = "test-seams"))]`: recall_scored_parity uses
# inject_vector_hamming_error / inject_embed_error (GROUP E degradation), and
# encode_intake_parity uses arm_transient_encode_ingest_failures (bounded-retry
# path). For an integration test the dependency crate's `test` cfg does NOT
# apply, so declare required-features so a default `cargo test` picks up the
# flag for these binaries automatically — mirroring corpus-kit's corpus_tests.
[[test]]
name = "recall_scored_parity"
required-features = ["test-seams"]

[[test]]
name = "encode_intake_parity"
required-features = ["test-seams"]

# These integration-test binaries use the test-only `NoopDispatcher` scheduler
# stub (re-exported as `SchedulerNoopDispatcher`). It is gated behind
# `#[cfg(any(test, feature = "test-seams"))]` so it is compiled out of the
# production binary (kept off the public API). For an integration test the
# library's own `test` cfg does NOT apply, so declare required-features so the
# stub is reachable when these binaries are built.
[[test]]
name = "scheduler_parity"
required-features = ["test-seams"]

[[test]]
name = "standing_signals_parity"
required-features = ["test-seams"]

[[test]]
name = "rag_wiring_parity"
required-features = ["test-seams"]

[[test]]
name = "coordinator_dispatcher_tests"
required-features = ["test-seams"]

# distillation_signal_tests uses the SchedulerNoopDispatcher stub, which is
# gated behind test-seams (same pattern as standing_signals_parity above).
[[test]]
name = "distillation_signal_tests"
required-features = ["test-seams"]

# dreaming_queue_parity uses the test-seam accessors dreaming_queue_is_mounted,
# dreaming_queue_pending_count, and dreaming_queue_drain — gated behind
# `#[cfg(any(test, feature = "test-seams"))]`. The library's own `test` cfg does
# NOT apply when compiling an integration test binary, so required-features is
# needed so cargo test includes the seam methods (same pattern as recall_scored_parity).
[[test]]
name = "dreaming_queue_parity"
required-features = ["test-seams"]
