[package]
name = "genius-locus-kit"
version = "0.35.0"
edition = "2021"
rust-version = "1.75"
description = "Rust port scaffold of GeniusLocusKit — the composition layer that coordinates N estates on one device. Parity-gated against the Swift reference."
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "genius_locus_kit"
path = "src/lib.rs"

[dependencies]
# F18.3 (2026-05-27): GLK now depends on SubstrateLib so the unified
# audit log can consume the canonical SHA-256 content-hash and HLC
# rather than hold byte-compatible local mirrors. The GLK-01/03 missions
# deferred this dependency ("no new dependencies"); the local types were
# always built byte-compatible anticipating exactly this wiring.
substrate-kernel = { path = "../../../libs/SubstrateKernel/rust" }
substrate-types = { path = "../../../libs/SubstrateTypes/rust" }
# SubstrateML (Layer 3 algorithms) is required so `MatrixTier::rebuild_temporal`
# can delegate to `temporal_causality_fold::fold` — the canonical T-matrix engine
# (cookbook §6.4). Mirrors the Swift dependency added 2026-06-04 per
# DECISION_MATRIXT_HOURLY_CADENCE_2026-06-04.md. Layering: GeniusLocusKit
# (composition) → SubstrateML (algorithms) does NOT invert.
substrate-ml = { path = "../../../libs/SubstrateML/rust" }
# The coordinator, handle, and lattice-overlap fan-out logic remain pure
# Rust; LocusKit-equivalent recall is mocked through a trait in those
# surfaces. The COW branch surface (src/branches), by contrast, IS the
# downstream mission that wires the real Rust LocusKit estate: a branch is
# a fresh in-memory `locus_kit::Estate` and branching is pure capture/recall
# over it, so it binds the real port directly (acyclic — LocusKit does not
# depend on GLK). persistence-kit supplies the in-memory `Storage` backend.
locus-kit = { path = "../../LocusKit/rust" }
persistence-kit = { path = "../../PersistenceKit/rust" }
# GLK_RAG_WIRING_001: VectorKit and CorpusKit are the RAG and vector
# seam dependencies. VectorSimilaritySignal queries VectorStore.find_nearest
# for row-pair proximity; ExternalCorpus.hybrid_recall routes through
# Corpus.recall for hybrid BM25+vector retrieval.
vectorkit = { path = "../../VectorKit/rust" }
corpus-kit = { path = "../../CorpusKit/rust" }
uuid = { version = "1", features = ["v4"] }
# Crypto hygiene: zeroize scope keys on drop and on revoke. This is the
# companion crate to aes-gcm (already a transitive dep via PersistenceKit);
# adding it as a direct dep makes the dependency explicit and enables the
# Zeroizing<> wrapper on mediated_keys storage.
# C-1 rationale: crypto hygiene companion to the approved aes-gcm crate.
# See DECISION_RUST_AEAD_CRATE_2026-06-05.
zeroize = "1"
# IntellectusLib is the zero-dependency telemetry floor (GLK_ROLLUPS_001).
# GeniusLocusKit emits per-estate rollup metrics at open/close/provision/quiesce/drain
# and at the verb-error boundary. Off-path cost: single AtomicBool::load(Acquire) +
# branch — zero allocation, no lock. Results byte-identical when disabled.
# Layering: genius-locus-kit (composition) → intellectus-lib (floor). No inversion.
# Per DECISION_LIFT_PACKAGE_SWIFT_RULE_2026-05-28 (Rust equivalent: no inversion rule).
intellectus-lib = { path = "../../../libs/IntellectusLib/rust" }
