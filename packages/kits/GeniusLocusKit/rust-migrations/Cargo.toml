[package]
name = "genius-locus-kit-migrations"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
publish = false

# [package.metadata.moot-test] selects migration-floor-1-0 so cargo compiles
# every [[test]] binary that carries a required-features declaration. Without
# this block scripts/moot-test passes no --features flag and cargo silently
# skips every required-features binary, emitting no warning. migration-floor-1-0
# enables every capsule from 1.0 to current; a narrower floor would leave the
# higher-floor capsule binaries unbuilt.
[package.metadata.moot-test]
test-features = ["migration-floor-1-0"]

[features]
default = []
migration-v1-0-to-v1-1 = []
# migration-v1-4-to-v1-5: moves the vector tier's schema-version ledger rows
# from their SynapseKit ids to their SynapseKit ids on populated estates
# (estate format 1.4 → 1.5 capsule).
migration-v1-4-to-v1-5 = []
# migration-v1-5-to-v1-6: drops the retired corpus_index_state.composition_policy
# column from populated estates by replaying CorpusKit's checkpoint ladder
# (estate format 1.5 → 1.6 capsule).
migration-v1-5-to-v1-6 = []
# migration-v1-6-to-v1-7: vacuums the whole-record float rows (vectors kind 1)
# and the hnsw_graph rows from populated estates, rebuilds the binary sidecar
# and releases the float representation claim (estate format 1.6 → 1.7 capsule).
migration-v1-6-to-v1-7 = []
# migration-v1-7-to-v1-8: seeds fact_extraction = "on" when absent (the
# on-by-default opt-out model) and stamps the v1_8 estate format (I-27).
migration-v1-7-to-v1-8 = []
# Floor features are the consumer-facing cumulative selections: each enables
# every capsule in the chain from that floor up to current. Floors 1.1 through
# 1.4 compile the same three capsules: the 1.1 → 1.2 step added a column
# CorpusKit's own ladder adds at open, the 1.2 → 1.3 step added a LocusKit
# column that schema v19 removed, and the 1.3 → 1.4 step seeded the index
# composition setting that retired with the policy, so the 1.4 → 1.5 capsule
# runs directly on any of those stamps; the 1.5 → 1.6, 1.6 → 1.7 and
# 1.7 → 1.8 capsules follow it.
migration-floor-1-0 = ["migration-v1-0-to-v1-1", "migration-v1-4-to-v1-5", "migration-v1-5-to-v1-6", "migration-v1-6-to-v1-7", "migration-v1-7-to-v1-8"]
migration-floor-1-1 = ["migration-v1-4-to-v1-5", "migration-v1-5-to-v1-6", "migration-v1-6-to-v1-7", "migration-v1-7-to-v1-8"]
migration-floor-1-2 = ["migration-v1-4-to-v1-5", "migration-v1-5-to-v1-6", "migration-v1-6-to-v1-7", "migration-v1-7-to-v1-8"]
migration-floor-1-3 = ["migration-v1-4-to-v1-5", "migration-v1-5-to-v1-6", "migration-v1-6-to-v1-7", "migration-v1-7-to-v1-8"]
migration-floor-1-4 = ["migration-v1-4-to-v1-5", "migration-v1-5-to-v1-6", "migration-v1-6-to-v1-7", "migration-v1-7-to-v1-8"]
migration-floor-1-5 = ["migration-v1-5-to-v1-6", "migration-v1-6-to-v1-7", "migration-v1-7-to-v1-8"]
migration-floor-1-6 = ["migration-v1-6-to-v1-7", "migration-v1-7-to-v1-8"]
migration-floor-1-7 = ["migration-v1-7-to-v1-8"]

[dependencies]
genius-locus-kit = { path = "../rust" }
corpus-kit = { path = "../../CorpusKit/rust" }
# locus-kit: the shared-content capsule opens the Locus estate through the
# coordinator seam. Layering: migrations sit above every kit they migrate; no
# inversion.
locus-kit = { path = "../../LocusKit/rust" }
persistence-kit = { path = "../../PersistenceKit/rust" }
synapsekit = { path = "../../SynapseKit/rust" }
# moot-product-identity: the Windows base-directory adoption capsule resolves
# the process home through `storage::process_home()` rather than spelling the
# `USERPROFILE` rule a second time. Layering: the identity library is a pure
# string/path library below every kit; no inversion.
moot-product-identity = { path = "../../../libs/MootProductIdentity/rust" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# rusqlite: required by geometry_normalization.rs (production code) for the
# ATTACH ... KEY '' escape hatch and sqlcipher_export repair sequence.
# Feature parity with persistence-kit's rusqlite dep — Cargo deduplicates to
# one instance; the "limits" feature from persistence-kit is additive and
# harmless in the union.
rusqlite = { version = "0.31", features = ["bundled-sqlcipher-vendored-openssl"] }

[dev-dependencies]
corpus-kit-providers = { path = "../../CorpusKit/rust-providers" }
# engram-lib: the whole-record float vacuum tests probe the binary lane with
# an Engram before and after the capsule. Already a transitive dependency via
# synapsekit; named here because a test binary cannot use a transitive crate.
engram-lib = { path = "../../../libs/EngramLib/rust" }
substrate-types = { path = "../../../libs/SubstrateTypes/rust" }
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.31", features = ["bundled-sqlcipher-vendored-openssl"] }

[[test]]
name = "shared_content_migration_tests"
required-features = ["migration-v1-0-to-v1-1"]

[[test]]
name = "scale_qualification"
required-features = ["migration-v1-0-to-v1-1"]

[[test]]
name = "storage_ledger_kit_id_migration_tests"
required-features = ["migration-v1-4-to-v1-5"]

[[test]]
name = "index_composition_column_drop_migration_tests"
required-features = ["migration-v1-5-to-v1-6"]

[[test]]
name = "whole_record_float_vacuum_migration_tests"
required-features = ["migration-v1-6-to-v1-7"]

[[test]]
name = "fact_extraction_setting_migration_tests"
required-features = ["migration-v1-7-to-v1-8"]

# The chain's entry gate (stamp read, floor and ceiling refusals, dispatch
# from the detected version) needs a compiled chain to gate.
[[test]]
name = "migration_chain_tests"
required-features = ["migration-v1-4-to-v1-5"]

# Geometry normalization is format-agnostic: runs on ANY plaintext estate with
# nonzero reserve, regardless of migration floor. No required-features gate.
[[test]]
name = "geometry_normalization"

# The Windows base-directory adoption capsule is base-directory work, not
# schema work: the old base can hold an estate of any format. No
# required-features gate, and the tests fabricate the old base in a scratch
# directory so they run on every host.
[[test]]
name = "windows_base_directory_adoption_tests"
