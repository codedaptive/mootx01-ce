[package]
name = "genius-locus-kit-migrations"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
publish = false

[features]
default = []
migration-v1-0-to-v1-1 = []
# migration-v1-1-to-v1-2: applies composition_policy column to corpus_index_state
# on estates created before corpus_index_state reached schema version 3 (estate format 1.1 → 1.2 capsule).
migration-v1-1-to-v1-2 = []
# migration-v1-2-to-v1-3: applies the drawers distilled_source_digest column
# (LocusKit schema v18) on populated estates written before the column
# existed (estate format 1.2 → 1.3 capsule).
migration-v1-2-to-v1-3 = []
# migration-v1-3-to-v1-4: stores the index composition setting (manifest key
# index_composition_policy) on populated estates written before the setting
# existed (estate format 1.3 → 1.4 capsule).
migration-v1-3-to-v1-4 = []
# Floor features are the consumer-facing cumulative selections: each enables
# every capsule in the chain from that floor up to current.
migration-floor-1-0 = ["migration-v1-0-to-v1-1", "migration-v1-1-to-v1-2", "migration-v1-2-to-v1-3", "migration-v1-3-to-v1-4"]
migration-floor-1-1 = ["migration-v1-1-to-v1-2", "migration-v1-2-to-v1-3", "migration-v1-3-to-v1-4"]
migration-floor-1-2 = ["migration-v1-2-to-v1-3", "migration-v1-3-to-v1-4"]
migration-floor-1-3 = ["migration-v1-3-to-v1-4"]

[dependencies]
genius-locus-kit = { path = "../rust" }
corpus-kit = { path = "../../CorpusKit/rust" }
# locus-kit: the 1.2 → 1.3 capsule replays LocusKit's own schema ladder
# (`locus_kit::schema::schema()`) on the migration storage, the same way the
# 1.1 → 1.2 capsule replays CorpusKit's. Layering: migrations sit above every
# kit they migrate; no inversion.
locus-kit = { path = "../../LocusKit/rust" }
persistence-kit = { path = "../../PersistenceKit/rust" }
vectorkit = { path = "../../VectorKit/rust" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# rusqlite: required by geometry_normalization.rs (production code) for the
# ATTACH ... KEY '' escape hatch and sqlcipher_export repair sequence.
# Feature parity with persistence-kit's rusqlite dep — Cargo deduplicates to
# one instance; the "limits" feature from persistence-kit is additive and
# harmless in the union.
rusqlite = { version = "0.31", features = ["bundled-sqlcipher-vendored-openssl"] }

[dev-dependencies]
corpus-kit-providers = { path = "../../CorpusKit/rust-providers" }
# context-distill-lib: the 1.2 → 1.3 capsule tests write a representation
# carrying the library's source digest to prove the column round-trips.
context-distill-lib = { path = "../../../libs/ContextDistillLib/rust" }
substrate-types = { path = "../../../libs/SubstrateTypes/rust" }
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.31", features = ["bundled-sqlcipher-vendored-openssl"] }

[[test]]
name = "shared_content_migration_tests"
required-features = ["migration-v1-0-to-v1-1"]

[[test]]
name = "scale_qualification"
required-features = ["migration-v1-0-to-v1-1"]

[[test]]
name = "distillation_storage_migration_tests"
required-features = ["migration-v1-0-to-v1-1"]

[[test]]
name = "index_composition_column_migration_tests"
required-features = ["migration-v1-1-to-v1-2"]

[[test]]
name = "distilled_source_digest_column_migration_tests"
required-features = ["migration-v1-2-to-v1-3"]

[[test]]
name = "index_composition_setting_migration_tests"
required-features = ["migration-v1-3-to-v1-4"]

# Geometry normalization is format-agnostic: runs on ANY plaintext estate with
# nonzero reserve, regardless of migration floor. No required-features gate.
[[test]]
name = "geometry_normalization"
