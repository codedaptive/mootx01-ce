[package]
name = "queuekit"
version = "0.1.0"
edition = "2021"
description = "QueueKit Rust parallel — FilesystemBackend per QUEUEKIT_SPEC"

[dependencies]
substrate-types = { path = "../../../libs/SubstrateTypes/rust" }
serde      = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
uuid       = { version = "1", features = ["v4"] }

[dependencies.notify]
version  = "6"
optional = true

[features]
default     = ["filesystem"]
filesystem  = []
persistencekit  = []
watch       = ["notify"]

[lib]
name = "queuekit"
path = "src/lib.rs"

[[test]]
name = "conformance"
path = "tests/conformance.rs"
