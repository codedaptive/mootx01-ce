[package]
name = "aria-mcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "ARIA_MCP Rust server — the Rust vertical's counterpart to the Swift ARIA_MCP server. Links the Rust kits (cognition-kit, neuron-kit, genius-locus-kit, locus-kit, persistence-kit) and hosts them behind a JSON-RPC 2.0 / stdio MCP transport. Wire-contract peer of the Swift server; internal architecture is idiomatic Rust. Per the no-FFI law, this binary is a COMPLETE Rust vertical — it never calls Swift, Swift never calls it."
license = "MIT OR Apache-2.0"
publish = false

# lib + bin: the lib is the server logic (testable), the bin wires stdin/stdout.
[lib]
name = "aria_mcp"
path = "src/lib.rs"

[[bin]]
name = "aria-mcp"
path = "src/main.rs"

[dependencies]
serde       = { version = "1", features = ["derive"] }
serde_json  = { version = "1" }
uuid        = { version = "1", features = ["v4"] }

# Kit path deps. From apps/ARIA_MCP/rust/, the repo root is ../../../
cognition-kit    = { path = "../../../packages/kits/CognitionKit/rust" }
genius-locus-kit = { path = "../../../packages/kits/GeniusLocusKit/rust" }
locus-kit        = { path = "../../../packages/kits/LocusKit/rust" }
neuron-kit       = { path = "../../../packages/kits/NeuronKit/rust" }
# The estate registry opens in-memory estates using InMemoryStorage and
# InMemoryDrawerStore — both production-path for v1. persistence-kit is
# a regular dep, not dev-only, because it is used in the lib (estate_registry).
persistence-kit  = { path = "../../../packages/kits/PersistenceKit/rust" }

[dev-dependencies]
# (no additional dev-only deps beyond persistence-kit already in [dependencies])
