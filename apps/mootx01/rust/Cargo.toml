# Cargo.toml — mootx01 (Rust CLI, Linux + Windows)
#
# The Rust vertical's counterpart to the Swift `mootx01` binary
# (apps/mootx01/Sources/mootx01). The user-facing CLI surface is 100% identical
# to the Swift binary; this crate conforms to that shared surface.
#
# Per the platform law: Swift ships on macOS/iOS/iPadOS only; this binary is
# what ships on Linux and Windows. Per the no-FFI law it is a COMPLETE Rust
# vertical — it links the Rust aria-mcp library for `serve` and never touches
# Swift.
#
# CLI parsing is hand-rolled in the library (no clap), matching the
# moot-mgr manager_cli.rs pattern: exact control over help text (§7
# conformance demands byte-identical help across implementations) and exit
# codes (§5 demands 64 for usage errors; clap defaults to 2).

[package]
name = "mootx01-cli"
version = "1.1.0-beta-19"
edition = "2021"
rust-version = "1.75"
description = "mootx01 — ARIA MCP server and estate management CLI (Rust vertical for Linux/Windows). Conforms to CLI_SURFACE_SPEC_v1.0."

[[bin]]
name = "mootx01"
path = "src/main.rs"

[lib]
name = "mootx01_cli"
path = "src/lib.rs"

[dependencies]
serde      = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
# SHA-256 verification of release downloads (upgrade); same version as aria-mcp.
sha2       = { version = "0.10" }
# libc: mlockall/setrlimit at daemon startup to keep the resident process's
# memory (including decrypted estate content) out of the swap file. C-1 per-crate
# exception (approved 2026-06-18) — the standard, minimal syscall crate; std has
# no mlockall. Best-effort and non-fatal; the estate file is encrypted at rest
# regardless.
libc       = { version = "0.2" }

# The complete Rust ARIA server (stdio + HTTP loops, backend selection,
# Autonomic Governor). `serve` is a thin translation of spec flags onto
# this library's ServerConfig.
aria-mcp = { path = "../../../packages/kits/AriaMcpKit/rust" }
# Reuse-estate installer repair: open the existing SQLCipher database with its
# sibling install key, then retire the legacy Rust audit-column dialect before
# the new binary serves it. Both crates are already in the product graph via
# aria-mcp; naming them directly keeps the install code plain and removable.
persistence-kit = { path = "../../../packages/kits/PersistenceKit/rust" }
rusqlite = { version = "0.31", features = ["bundled-sqlcipher-vendored-openssl"] }
# queuekit: dream command acquires the "dreaming" DrainLease to prevent
# concurrent dreamers for the same estate. Already
# a transitive dep via aria-mcp; named here so commands/dream.rs can
# import DrainLease explicitly. Per in-repository dependency direction.
queuekit = { path = "../../../packages/kits/QueueKit/rust", features = ["persistencekit"] }
# uuid: per-process instance token for the dreaming DrainLease — prevents
# a reused PID after a crash from impersonating the prior lease holder.
uuid = { version = "1", features = ["v4"] }
# trash: data-retention on uninstall/reinstall — estate + moot-mgr databases
# move to the platform trash (macOS Trash / Recycle Bin / XDG trash) instead
# of hard deletion, so a destructive confirmation still leaves a recovery
# window. Swift's macOS leg uses FileManager.trashItem for the same contract.
trash = "5.2.3"
# locus-kit + vault-kit: the `mootx01 upgrade` kg_facts identity backfill
# (MXE-MI). locus-kit owns the backfill (kg_fact_identity_backfill) and the
# schema ladder that adds the identity columns; vault-kit supplies the
# DrawerMapping stable-source-key resolver, injected at this app layer
# because locus-kit sits below vault-kit and must not depend on it. Both
# crates are already in the product graph via aria-mcp; naming them directly
# keeps the upgrade wiring plain and removable (same rationale as
# persistence-kit above). locus-kit also serves the installer reuse
# integration gate in this crate's tests.
locus-kit = { path = "../../../packages/kits/LocusKit/rust" }
vault-kit = { path = "../../../packages/kits/VaultKit/rust" }
# genius-locus-kit + genius-locus-kit-migrations: `mootx01 upgrade`
# shared-content reclaim (MXE_RC_01). EstateCoordinator::open is the
# migration-host seam; SharedContentMigrationExt provides the P5 step.
# Both are already in the product graph via aria-mcp; naming them directly
# keeps the upgrade wiring plain and removable.
genius-locus-kit = { path = "../../../packages/kits/GeniusLocusKit/rust" }
genius-locus-kit-migrations = { path = "../../../packages/kits/GeniusLocusKit/rust-migrations" }
# corpus-kit: `mootx01 upgrade` corpus-counts migration (CORPUS-COUNTS-01).
# Owns the reindex latch (reindex_required) called at the tail of the
# vocab-table clear + counts-blob zeroing step. Already in the product graph
# via aria-mcp; naming it directly keeps the upgrade wiring plain and
# removable (same rationale as persistence-kit above).
corpus-kit = { path = "../../../packages/kits/CorpusKit/rust" }
# synapsekit + substrate-kernel: the span-encode and vector-reclaim steps of
# `mootx01 upgrade` write encoder span rows (VectorStore::write_span_vectors,
# int8_vec::quantize) and reclaim the retired dense-family rows
# (VectorStore::reclaim_retired_vector_rows). Both were resolving transitively
# through genius-locus-kit; naming them keeps the upgrade wiring explicit.
synapsekit = { path = "../../../packages/kits/SynapseKit/rust" }
substrate-kernel = { path = "../../../packages/libs/SubstrateKernel/rust" }
# corpus-kit-providers: `mootx01 db composition --set` wires the Corpus it
# rebuilds with `default_ensemble()`, the same five-signal ensemble the ARIA
# registry serves with, so the rebuilt rows are the rows serve will read.
# Already in the product graph via aria-mcp; naming it directly keeps the
# command plain and removable (same rationale as persistence-kit above).
corpus-kit-providers = { path = "../../../packages/kits/CorpusKit/rust-providers" }
# adornment-lib: AdornmentMinterDescriptor and StoredAdornment value types
# used by run_adornment_store_migration to register legacy minter rows and
# move drawers.adornment text to the normalized adornments table
# (ADORN-STORE-02 Part C, schema v17). No layering inversion: adornment-lib
# is upstream of locus-kit in the dependency graph.
adornment-lib = { path = "../../../packages/libs/AdornmentLib/rust" }

# unicode-normalization: NFC normalization for the review engine's normalize_subject.
# Required for F9 parity: Swift uses precomposedStringWithCanonicalMapping (NFC) to
# normalize subject strings before duplicate-detection comparison. Without NFC, a
# decomposed Unicode subject (e.g. "e" + U+0301 combining acute) would not match the
# precomposed form ("é") in the Rust engine, causing divergence from Swift's output.
# Authorized by the mission orchestrator as a correctness dependency (2026-08-24).
unicode-normalization = "0.1"

[features]
# The span-encoder runtime (candle, all-MiniLM-L6-v2) ships in the product
# binary by default: `mootx01 serve` activates it for estates provisioned with
# embedding_provider = "encoder" and a bundled model directory. Build with
# `--no-default-features` for a lexical-only binary without the ML crates.
default = ["encoder"]
encoder = ["genius-locus-kit/encoder"]

[dev-dependencies]
# tempfile: temporary directories for sensitivity_hashes unit tests.
tempfile = "3"
# context-distill-lib: the upgrade convergence test stamps rows with the
# library's source digest to prove regeneration under the currency rule.
context-distill-lib = { path = "../../../packages/libs/ContextDistillLib/rust" }
