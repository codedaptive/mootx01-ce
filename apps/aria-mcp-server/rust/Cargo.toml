[package]
name = "aria-mcp-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "aria-mcp-server — the standalone reference MCP server binary. A thin stdin/stdout wrapper over the aria_mcp library (packages/kits/AriaMcpKit/rust); the same runtime mootx01 serve runs by linking the library directly. Per the no-FFI law, this is a COMPLETE Rust vertical — it never calls Swift, Swift never calls it."
license = "MIT OR Apache-2.0"
publish = false

# The reference-server binary. All server logic is in the aria_mcp library;
# this bin is the stdin/stdout entry point (aria_mcp::runtime::run).
[[bin]]
name = "aria-mcp"
path = "src/main.rs"

[dependencies]
# The server-logic library lives in AriaMcpKit; this binary just wires it to I/O.
aria-mcp = { path = "../../../packages/kits/AriaMcpKit/rust" }
# Resident gold-miner engine install at startup (DEFAULT-MINT-01): the dev
# binary mirrors the product serve's engine block so the two Rust entry
# points do not diverge on minting. In-repo kit dependency; layering holds
# (app -> lib).
# The estate catalog and open posture the entry point resolves its estate through.
genius-locus-kit = { path = "../../../packages/kits/GeniusLocusKit/rust" }
moot-product-identity = { path = "../../../packages/libs/MootProductIdentity/rust" }

[dev-dependencies]
# test-seams enables EstateCatalog::set_configuration_directory_override,
# the test seam used by the estate-selection tests below.
genius-locus-kit = { path = "../../../packages/kits/GeniusLocusKit/rust", features = ["test-seams"] }
# serde_json needed by tests/estate_selection.rs to parse dispatch_tool results.
serde_json = "1"

[features]
# Forward the compile-time ARIA public-surface selection to the server logic.
# No default features are changed, so this binary remains v1 unless selected.
aria-v2 = ["aria-mcp/aria-v2"]
