# GeniusLocus reference conformance CI
#
# Bit-identity gate per the parallel-sub-agent authoring decision:
# both Swift and Rust scalar references must produce the same
# vector file (modulo `generated_at`) for the same seed, and each
# language's validator must accept both files. Any divergence
# fails the PR.
#
# The matrix axes are language × backend × OS. This file gates on
# the SCALAR oracles only; accelerated backends (AMX, Metal, AVX-
# 512, NEON) land in a separate workflow once those backends
# ship.
#
# See:
#   docs/validation/substrate_math_performance/test-harness/docs/test-vector-format.md
#   docs/validation/substrate_math_performance/test-harness/docs/primitive-walkthrough-SimHash.md
#   docs/decisions/DECISION_RUST_PORT_ROUTING_2026-05-16.md

name: GeniusLocus reference conformance

on:
  pull_request:
    paths:
      - 'docs/validation/substrate_math_performance/test-harness/**'
      - 'docs/engineering/GENIUSLOCUS_ENGINEERING_COOKBOOK_*.md'
      - '.github/workflows/geniuslocus-conformance.yml'
  push:
    branches: [stable/1.0.x, develop/1.0.x]
    paths:
      - 'docs/validation/substrate_math_performance/test-harness/**'
  workflow_dispatch:

env:
  HARNESS_ROOT: docs/validation/substrate_math_performance/test-harness
  # The conformance seed. Stable across PRs; bumped only when the
  # case-generation logic itself changes (which requires a harness
  # version bump per test-vector-format.md).
  CONFORMANCE_SEED: '0xCAFEBABEDEADBEEF'

jobs:

  swift-build-test:
    name: Swift harness — build, unit tests, generate
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Swift 6.2 toolchain (latest stable Xcode)
        # A real stable Xcode.app keeps the build toolchain and Swift runtime
        # consistent; "newest" could grab a beta whose runtime lacks symbols
        # the build links against (swift test dlopen failure).
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Swift version
        run: swift --version

      - name: Build Swift harness
        working-directory: ${{ env.HARNESS_ROOT }}/swift
        run: swift build

      - name: Run Swift unit tests
        working-directory: ${{ env.HARNESS_ROOT }}/swift
        run: swift test

      - name: Generate Swift vectors
        working-directory: ${{ env.HARNESS_ROOT }}/swift
        run: |
          for primitive in simhash hamming or_reduce bitwise anomaly hlc fingerprint lattice info_theory bradley_terry partial_state_recall temporal_compression tier_contribution fft hamming_nn pairing_handshake nmf audit_log_fold matrix_decay eigenvalue_centrality moment_summary field_presence_matrix_f fnv bit_field_masked_equals; do
            swift run gen-vectors --primitive "$primitive" --seed "${{ env.CONFORMANCE_SEED }}"
          done

      - name: Upload Swift-generated vectors
        uses: actions/upload-artifact@v4
        with:
          name: swift-vectors
          path: ${{ env.HARNESS_ROOT }}/vectors/*.json

  rust-build-test:
    name: Rust harness — build, unit tests, generate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, windows-11-arm]
    # The vector-generation steps are bash for-loops; Windows defaults to
    # PowerShell, so force bash (Git Bash ships on the Windows runner).
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Show Rust version
        run: rustc --version && cargo --version

      - name: Build Rust harness
        working-directory: ${{ env.HARNESS_ROOT }}/rust
        run: cargo build --release

      - name: Run Rust unit tests
        working-directory: ${{ env.HARNESS_ROOT }}/rust
        run: cargo test --release

      - name: Generate Rust vectors
        working-directory: ${{ env.HARNESS_ROOT }}/rust
        run: |
          mkdir -p ../rust-generated
          for primitive in simhash hamming or_reduce bitwise anomaly hlc fingerprint lattice info_theory bradley_terry partial_state_recall temporal_compression tier_contribution fft hamming_nn pairing_handshake nmf audit_log_fold matrix_decay eigenvalue_centrality moment_summary field_presence_matrix_f fnv bit_field_masked_equals; do
            cargo run --release --bin gen-vectors -- \
              --primitive "$primitive" \
              --seed "${{ env.CONFORMANCE_SEED }}" \
              --out "../rust-generated/${primitive}.json"
          done

      - name: Upload Rust-generated vectors
        uses: actions/upload-artifact@v4
        with:
          name: rust-vectors-${{ matrix.os }}
          path: ${{ env.HARNESS_ROOT }}/rust-generated/*.json

  cross-language-validation:
    name: Four-way conformance matrix
    needs: [swift-build-test, rust-build-test]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Swift 6.2 toolchain (latest stable Xcode)
        # Builds the Swift validator below; needs a consistent 6.2 toolchain.
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Download Swift-generated vectors
        uses: actions/download-artifact@v4
        with:
          name: swift-vectors
          path: ${{ env.HARNESS_ROOT }}/vectors

      - name: Download Rust-generated vectors (linux)
        uses: actions/download-artifact@v4
        with:
          # Rust vectors are deterministic across targets; the Linux leg is
          # the canonical source for the cross-language comparison.
          name: rust-vectors-ubuntu-latest
          path: ${{ env.HARNESS_ROOT }}/rust-generated

      - name: Compute CRCs and confirm cross-language equality
        working-directory: ${{ env.HARNESS_ROOT }}
        run: |
          set -e
          for primitive in simhash hamming or_reduce bitwise anomaly hlc fingerprint lattice info_theory bradley_terry partial_state_recall temporal_compression tier_contribution fft hamming_nn pairing_handshake nmf audit_log_fold matrix_decay eigenvalue_centrality moment_summary field_presence_matrix_f fnv bit_field_masked_equals; do
            swift_crc=$(grep -m1 '"output_crc32"' vectors/${primitive}.json | sed 's/.*"\(0x[0-9a-f]*\)".*/\1/')
            rust_crc=$(grep -m1 '"output_crc32"' rust-generated/${primitive}.json | sed 's/.*"\(0x[0-9a-f]*\)".*/\1/')
            echo "$primitive: swift_crc=$swift_crc rust_crc=$rust_crc"
            if [ "$swift_crc" != "$rust_crc" ]; then
              echo "::error::CRC mismatch for $primitive: swift=$swift_crc rust=$rust_crc"
              exit 1
            fi
          done

      - name: Build Swift validator
        working-directory: ${{ env.HARNESS_ROOT }}/swift
        run: swift build

      - name: Build Rust validator
        working-directory: ${{ env.HARNESS_ROOT }}/rust
        run: cargo build --release

      - name: Cell 1 — Swift validates Swift-generated
        working-directory: ${{ env.HARNESS_ROOT }}/swift
        run: |
          for primitive in simhash hamming or_reduce bitwise anomaly hlc fingerprint lattice info_theory bradley_terry partial_state_recall temporal_compression tier_contribution fft hamming_nn pairing_handshake nmf audit_log_fold matrix_decay eigenvalue_centrality moment_summary field_presence_matrix_f fnv bit_field_masked_equals; do
            swift run validate-vectors ../vectors/${primitive}.json
          done

      - name: Cell 2 — Rust validates Swift-generated
        working-directory: ${{ env.HARNESS_ROOT }}/rust
        run: |
          for primitive in simhash hamming or_reduce bitwise anomaly hlc fingerprint lattice info_theory bradley_terry partial_state_recall temporal_compression tier_contribution fft hamming_nn pairing_handshake nmf audit_log_fold matrix_decay eigenvalue_centrality moment_summary field_presence_matrix_f fnv bit_field_masked_equals; do
            cargo run --release --bin validate-vectors -- ../vectors/${primitive}.json
          done

      - name: Cell 3 — Swift validates Rust-generated
        working-directory: ${{ env.HARNESS_ROOT }}/swift
        run: |
          for primitive in simhash hamming or_reduce bitwise anomaly hlc fingerprint lattice info_theory bradley_terry partial_state_recall temporal_compression tier_contribution fft hamming_nn pairing_handshake nmf audit_log_fold matrix_decay eigenvalue_centrality moment_summary field_presence_matrix_f fnv bit_field_masked_equals; do
            swift run validate-vectors ../rust-generated/${primitive}.json
          done

      - name: Cell 4 — Rust validates Rust-generated
        working-directory: ${{ env.HARNESS_ROOT }}/rust
        run: |
          for primitive in simhash hamming or_reduce bitwise anomaly hlc fingerprint lattice info_theory bradley_terry partial_state_recall temporal_compression tier_contribution fft hamming_nn pairing_handshake nmf audit_log_fold matrix_decay eigenvalue_centrality moment_summary field_presence_matrix_f fnv bit_field_masked_equals; do
            cargo run --release --bin validate-vectors -- ../rust-generated/${primitive}.json
          done

  rust-aarch64-linux:
    name: Rust harness — Linux aarch64 (native)
    # Native aarch64 runner (GitHub-hosted, free for public repos). Replaces the
    # former x86 cross-compile + QEMU path, which failed to resolve the target
    # std; a native build needs no cross linker, no QEMU, and is a real gate.
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build + test (native aarch64)
        working-directory: ${{ env.HARNESS_ROOT }}/rust
        run: |
          cargo build --release
          cargo test --release

  notify-completion:
    name: Conformance matrix complete
    needs: [cross-language-validation]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All four cells passed. Bit-identity verified."
