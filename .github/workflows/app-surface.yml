# App & installer surface CI
#
# The conformance workflows gate the substrate (the kits/libs). This workflow
# gates the consumer-facing surface — the `mootx01` CLI/installer, the `moot-mgr`
# console, the install scripts, and the start-here docs — so a change there
# can't silently break the thing outsiders actually install.
#
# Platform contract: Swift builds on macos-26 (the OS Swift 6.2 runtime the
# packages require); Rust on Linux. The pull_request trigger is wired now so the
# gate is ready the moment pull requests open post-beta (see CONTRIBUTING.md);
# until then it runs as push CI on the two live branches.

name: App & installer surface

on:
  push:
    branches: [stable/1.0.x, develop/1.0.x]
    paths: &surface
      - 'apps/mootx01/**'
      - 'apps/moot-mgr/**'
      - 'install*.sh'
      - 'install.ps1'
      - 'docs/start-here/**'
      - '*.md'
      - '.github/workflows/app-surface.yml'
  pull_request:
    paths: *surface
  workflow_dispatch:

jobs:
  swift-apps:
    name: Swift apps — build + test (macOS)
    # DIAGNOSTIC (loopback theory test): the moot-mgr HTTP tests fail on macos-26
    # with ~60s loopback-connection latency (URLSession -1001; even the raw-socket
    # SSE test only "passes" by waiting it out at ~62s). Pin the TEST job to the
    # prior stable image to confirm the pathology is macos-26-specific. The Release
    # build job stays on macos-26 (it needs the Swift 6.2 runtime); if this image
    # cannot build the Swift-6.2 code, that itself answers whether macos-15 is viable.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Swift 6.2 toolchain (latest stable Xcode)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Swift version
        run: swift --version

      - name: mootx01 (CLI / installer) test
        working-directory: apps/mootx01
        run: swift test

      - name: moot-mgr (console) test
        working-directory: apps/moot-mgr
        run: swift test

  rust-apps:
    name: Rust apps — build + test
    runs-on: ${{ matrix.os }}
    # Safety net: should a test ever hang (e.g. a control-channel accept that
    # never exits), fail the leg fast rather than stalling the run for hours.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: mootx01 rust test
        working-directory: apps/mootx01/rust
        run: cargo test --release

      - name: moot-mgr rust test
        working-directory: apps/moot-mgr/rust
        run: cargo test --release

  guards:
    name: Edition boundary + static assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Edition boundary (no SHARED → EE-only references)
        run: make check-edition-boundary

      - name: moot-mgr static assets in sync
        run: make check-static-assets
