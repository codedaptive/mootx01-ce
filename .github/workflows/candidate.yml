# Candidate — test builds from candidate/1.0.x, published as GitHub pre-releases.
#
# Branch model: develop (default, active work) → candidate (this: test builds /
# pre-release) → stable (last-known-good; release tags cut from there).
#
# What this proves (and ONLY this): we have working binaries, and those binaries
# have installers that work. It does NOT run the unit/kit suite — regression
# testing is `make test`, which runs as a daily job on develop
# (develop-daily-test.yml), not here.
#
# Flow: build artifacts for every platform (each with a binary smoke), sign macOS
# artifacts best-effort (same certs + notarization as release.yml when secrets
# are available — so the .pkg installer path is tested exactly as shipped),
# publish as a GitHub *pre-release* (kept: last 4), then install that
# pre-release via the repo's own install.sh on Linux + macOS and confirm it
# runs. Windows install verification is the operator's VM harness
# (tools/ce-installer-harness) run against the pre-release before promotion.
# Checksums are minisign-signed best-effort (a candidate must not fail just
# because the key is absent).
#
# Testers install a candidate with the pre-release tag:
#   MOOTX01_VERSION=1.0.10-prerelease.42 sh install.sh
# (the normal `releases/latest` path deliberately skips pre-releases).

name: candidate

on:
  push:
    branches: ["candidate/1.0.x"]
  schedule:
    # Weekly build, Monday 09:00 UTC. Scheduled runs fire from the DEFAULT
    # branch (develop), so every job pins `ref: candidate/1.0.x` to build the
    # candidate line regardless of what triggered the run.
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-build
  cancel-in-progress: true

jobs:
  # ── Derive the candidate version/tag ────────────────────────────────────────
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: candidate/1.0.x
          persist-credentials: false
      - id: v
        run: |
          # Source version constant (matches Swift Mootx01.currentVersion).
          version="$(grep -m1 '^version = ' apps/mootx01/rust/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          # Tag is <version>-prerelease.<run> with NO leading v on purpose — a
          # v* tag would trigger release.yml and a signed public release. The
          # `-prerelease` suffix (with the `-`) is what the installers key on to
          # skip their v-normalization, so it installs as-is.
          tag="${version}-prerelease.${{ github.run_number }}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Candidate build: $tag"

  # ── macOS builds (arm64 + x86_64) — signed best-effort ───────────────────────
  # Mirrors release.yml's signing pipeline when Apple Developer ID secrets are
  # available. Falls back to unsigned when they aren't (forks, first-time setup).
  # This ensures the .pkg installer path is tested in the SAME signed+notarized
  # form that release.yml ships to users.
  macos:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: candidate/1.0.x
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: Build release binaries
        run: |
          archflag=""
          [ "${{ matrix.arch }}" = "x86_64" ] && archflag="--arch x86_64"
          swift build -c release --package-path apps/mootx01  --product mootx01  $archflag
          swift build -c release --package-path apps/moot-mgr --product moot-mgr $archflag
          MOOT_BIN="$(find apps/mootx01/.build  -name mootx01  -path '*/release/mootx01'  | head -1)"
          MGR_BIN="$(find apps/moot-mgr/.build  -name moot-mgr -path '*/release/moot-mgr' | head -1)"
          echo "MOOT_BIN=$MOOT_BIN" >> "$GITHUB_ENV"
          echo "MGR_BIN=$MGR_BIN"   >> "$GITHUB_ENV"

      - name: Import Developer ID Application Certificate
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_SIGNING_CERT_P12 }}
          CERT_P12_PASSWORD: ${{ secrets.APPLE_SIGNING_CERT_PASSWORD }}
        run: |
          if [ -z "$CERT_P12_BASE64" ]; then
            echo "::warning::APPLE_SIGNING_CERT_P12 not set — skipping code signing"
            exit 0
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASS="$(openssl rand -base64 32)"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERT_P12_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          rm "$RUNNER_TEMP/cert.p12"
          echo "SIGNING_READY=1" >> "$GITHUB_ENV"

      - name: Sign binaries (best-effort)
        if: ${{ env.SIGNING_READY == '1' }}
        run: |
          IDENTITY="Developer ID Application: Codedaptive, LLC (${{ secrets.APPLE_TEAM_ID }})"
          codesign --options runtime --timestamp --sign "$IDENTITY" "$MOOT_BIN"
          codesign --options runtime --timestamp --sign "$IDENTITY" "$MGR_BIN"
          codesign --verify --deep --strict --verbose=2 "$MOOT_BIN"
          codesign --verify --deep --strict --verbose=2 "$MGR_BIN"

      - name: Notarize binaries (best-effort)
        if: ${{ env.SIGNING_READY == '1' }}
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          mkdir -p ~/.private_keys
          echo "$APPLE_API_KEY_P8" | base64 --decode > \
            ~/.private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          zip -j "$RUNNER_TEMP/binaries.zip" "$MOOT_BIN" "$MGR_BIN"
          xcrun notarytool submit "$RUNNER_TEMP/binaries.zip" \
            --key ~/.private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8 \
            --key-id "${{ secrets.APPLE_API_KEY_ID }}" \
            --issuer "${{ secrets.APPLE_API_KEY_ISSUER }}" \
            --wait
          rm -f ~/.private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8

      - name: Package tarball
        run: |
          cp "$MOOT_BIN" mootx01
          cp "$MGR_BIN"  moot-mgr
          rm -rf ./*.bundle
          cp -R "$(dirname "$MOOT_BIN")"/*.bundle .
          for b in "$(dirname "$MGR_BIN")"/*.bundle; do
            bn="$(basename "$b")"
            [ -e "./$bn" ] || cp -R "$b" .
          done
          asset="mootx01-${{ needs.meta.outputs.tag }}-macos-${{ matrix.arch }}.tar.gz"
          tar -czf "$asset" mootx01 moot-mgr ./*.bundle
          echo "ASSET=$asset" >> "$GITHUB_ENV"
          tar -tzf "$asset" | grep -qx 'mootx01' || { echo "no mootx01 in archive"; exit 1; }
          [ "${{ matrix.arch }}" = "arm64" ] && ./mootx01 --version || true

      - name: Build setup assistant
        run: |
          archflag=""
          [ "${{ matrix.arch }}" = "x86_64" ] && archflag="--arch x86_64"
          swift build -c release --package-path apps/Mootx01-Setup --product Mootx01Setup $archflag
          SETUP_BIN="$(find apps/Mootx01-Setup/.build -name Mootx01Setup -path '*/release/Mootx01Setup' | head -1)"
          echo "SETUP_BIN=$SETUP_BIN" >> "$GITHUB_ENV"

      - name: Sign setup assistant (best-effort)
        if: ${{ env.SIGNING_READY == '1' }}
        run: |
          IDENTITY="Developer ID Application: Codedaptive, LLC (${{ secrets.APPLE_TEAM_ID }})"
          codesign --options runtime --timestamp --sign "$IDENTITY" "$SETUP_BIN"
          codesign --verify --deep --strict --verbose=2 "$SETUP_BIN"

      - name: Import Developer ID Installer Certificate (best-effort)
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_INSTALLER_CERT_P12 }}
          CERT_P12_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERT_PASSWORD }}
        run: |
          if [ -z "$CERT_P12_BASE64" ]; then
            echo "::warning::APPLE_INSTALLER_CERT_P12 not set — skipping installer cert"
            exit 0
          fi
          INST_KEYCHAIN="$RUNNER_TEMP/installer.keychain"
          INST_KEYCHAIN_PASS="$(openssl rand -base64 32)"
          security create-keychain -p "$INST_KEYCHAIN_PASS" "$INST_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$INST_KEYCHAIN"
          security unlock-keychain -p "$INST_KEYCHAIN_PASS" "$INST_KEYCHAIN"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/installer-cert.p12"
          security import "$RUNNER_TEMP/installer-cert.p12" \
            -k "$INST_KEYCHAIN" \
            -P "$CERT_P12_PASSWORD" \
            -T /usr/bin/productsign
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$INST_KEYCHAIN_PASS" "$INST_KEYCHAIN"
          security list-keychain -d user -s "$RUNNER_TEMP/build.keychain" "$INST_KEYCHAIN"
          rm "$RUNNER_TEMP/installer-cert.p12"
          echo "INSTALLER_CERT_READY=1" >> "$GITHUB_ENV"

      - name: Build macOS .pkg installer (signed when certs available)
        run: |
          # Pass signing identities via env when certs were imported; build-pkg.sh
          # reads INSTALLER_IDENTITY, APP_IDENTITY, and warns-and-proceeds without.
          if [ "${SIGNING_READY:-}" = "1" ]; then
            export APP_IDENTITY="Developer ID Application: Codedaptive, LLC (${{ secrets.APPLE_TEAM_ID }})"
          fi
          if [ "${INSTALLER_CERT_READY:-}" = "1" ]; then
            export INSTALLER_IDENTITY="Developer ID Installer: Codedaptive, LLC (${{ secrets.APPLE_TEAM_ID }})"
          fi
          bash distribution/macos/build-pkg.sh \
            "${{ needs.meta.outputs.tag }}" "${{ matrix.arch }}" "$MOOT_BIN" "$MGR_BIN" "$SETUP_BIN"
          pkg="mootx01-${{ needs.meta.outputs.tag }}-macos-${{ matrix.arch }}.pkg"
          [ -f "$pkg" ] || { echo "✗ .pkg not produced"; exit 1; }
          echo "PKG=$pkg" >> "$GITHUB_ENV"

      - name: Notarize macOS .pkg (best-effort)
        if: ${{ env.INSTALLER_CERT_READY == '1' }}
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_ISSUER: ${{ secrets.APPLE_API_KEY_ISSUER }}
        run: |
          mkdir -p ~/.private_keys
          KEYFILE=~/.private_keys/AuthKey_${APPLE_API_KEY_ID}.p8
          echo "$APPLE_API_KEY_P8" | base64 --decode > "$KEYFILE"
          SUBMIT_JSON="$(xcrun notarytool submit "${PKG}" \
            --key "$KEYFILE" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_KEY_ISSUER" \
            --output-format json --wait)"
          echo "$SUBMIT_JSON"
          STATUS="$(printf '%s' "$SUBMIT_JSON" | python3 -c 'import sys,json;print(json.load(sys.stdin)["status"])')"
          if [ "$STATUS" != "Accepted" ]; then
            SUBMIT_ID="$(printf '%s' "$SUBMIT_JSON" | python3 -c 'import sys,json;print(json.load(sys.stdin)["id"])')"
            echo "::warning::pkg notarization $STATUS — Apple notary log follows:"
            xcrun notarytool log "$SUBMIT_ID" \
              --key "$KEYFILE" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_KEY_ISSUER" || true
            rm -f "$KEYFILE"
            # Best-effort: warn but do not fail the candidate build.
            echo "::warning::macOS .pkg notarization failed ($STATUS) — candidate .pkg is signed but not notarized"
          else
            xcrun stapler staple "${PKG}"
            rm -f "$KEYFILE"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            ${{ env.ASSET }}
            ${{ env.PKG }}

  # ── Unsigned Linux builds (x86_64 + arm64) ──────────────────────────────────
  linux:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: candidate/1.0.x
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Build
        run: |
          cargo build --release --locked --manifest-path apps/mootx01/rust/Cargo.toml
          cargo build --release --locked --manifest-path apps/moot-mgr/rust/Cargo.toml
          cp apps/mootx01/rust/target/release/mootx01  mootx01
          cp apps/moot-mgr/rust/target/release/moot-mgr moot-mgr
          asset="mootx01-${{ needs.meta.outputs.tag }}-linux-${{ matrix.arch }}.tar.gz"
          tar -czf "$asset" mootx01 moot-mgr
          echo "ASSET=$asset" >> "$GITHUB_ENV"
          # Smoke: both arches are native on their runners.
          ./mootx01 --version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-${{ matrix.arch }}
          path: ${{ env.ASSET }}

  # ── Unsigned Windows builds (x86_64 + arm64): zip archive + Inno setup.exe ───
  windows:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: candidate/1.0.x
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}
      - name: Build + zip
        shell: pwsh
        run: |
          cargo build --release --locked --manifest-path apps/mootx01/rust/Cargo.toml --target ${{ matrix.target }}
          cargo build --release --locked --manifest-path apps/moot-mgr/rust/Cargo.toml --target ${{ matrix.target }}
          Copy-Item "apps/mootx01/rust/target/${{ matrix.target }}/release/mootx01.exe"  "mootx01.exe"
          Copy-Item "apps/moot-mgr/rust/target/${{ matrix.target }}/release/moot-mgr.exe" "moot-mgr.exe"
          # Smoke: both arches run natively on their runners.
          .\mootx01.exe --version
          $asset = "mootx01-${{ needs.meta.outputs.tag }}-windows-${{ matrix.arch }}.zip"
          Compress-Archive -Path "mootx01.exe","moot-mgr.exe" -DestinationPath $asset
          "ARCHIVE=$asset" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Install Inno Setup
        # windows-11-arm ships Chocolatey; Inno 6 is x86 and runs under emulation.
        run: choco install innosetup -y --no-progress
      - name: Build setup.exe (unsigned)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          # BinDir must be absolute — ISCC resolves /DBinDir relative to the .iss
          # SourceDir (distribution\windows\), not the caller's CWD.
          & $iscc `
            "/DMyAppVersion=${{ needs.meta.outputs.tag }}" `
            "/DArch=${{ matrix.arch }}" `
            "/DBinDir=$($PWD.Path)" `
            "/O." `
            "distribution/windows/mootx01-setup.iss"
          "SETUP=mootx01-${{ needs.meta.outputs.tag }}-windows-${{ matrix.arch }}-setup.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-${{ matrix.arch }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.SETUP }}

  # ── Publish the pre-release + prune to the last 4 ───────────────────────────
  prerelease:
    needs: [meta, macos, linux, windows]
    permissions:
      contents: write   # create the pre-release + prune old ones
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: candidate/1.0.x
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: Assemble checksums (+ best-effort minisign)
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_SECRET_KEY_PASSWORD: ${{ secrets.MINISIGN_SECRET_KEY_PASSWORD }}
        run: |
          mkdir -p flat
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.exe' -o -name '*.pkg' \) \
            -exec cp {} flat/ \;
          ( cd flat && sha256sum * > ../checksums.txt )
          cp checksums.txt flat/
          # Best-effort minisign (stable release fails closed; a candidate does
          # not). Without it, install.sh on Linux fail-closes for this candidate.
          if [ -n "${MINISIGN_SECRET_KEY}" ]; then
            sudo apt-get update && sudo apt-get install -y minisign
            keyfile="$(mktemp)"; chmod 600 "$keyfile"
            printf '%s' "${MINISIGN_SECRET_KEY}" > "$keyfile"
            echo "${MINISIGN_SECRET_KEY_PASSWORD}" | minisign -S -s "$keyfile" -m flat/checksums.txt
            rm -f "$keyfile"
          else
            echo "::warning::MINISIGN_SECRET_KEY not set — candidate checksums unsigned; install.sh on Linux will fail-closed for this candidate."
          fi
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          notes="Automated **candidate/test build** from \`candidate/1.0.x\` at \`${{ github.sha }}\`.

          NOT a release. macOS binaries and .pkg are Apple Developer ID signed and notarized when secrets are available. Linux and Windows binaries are unsigned. For testing only.

          Install this build:
          \`\`\`
          MOOTX01_VERSION=${TAG} sh install.sh
          \`\`\`"
          gh release create "$TAG" \
            --prerelease \
            --title "Candidate ${TAG}" \
            --notes "$notes" \
            flat/*
      - name: Prune to the last 4 candidate pre-releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Select our candidate pre-releases: prerelease + a `-prerelease.`
          # tag. Keeps real releases (v1.0.10, v1.0.10-beta) untouched.
          gh release list --limit 100 --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease and (.tagName|contains("-prerelease.")))]
                  | sort_by(.createdAt) | reverse | .[4:] | .[].tagName' \
          | while read -r old; do
              [ -n "$old" ] || continue
              echo "pruning old candidate: $old"
              gh release delete "$old" --cleanup-tag --yes
            done

  # ── Verify the installer works: install the published pre-release via the ───
  # repo's own install.sh, in a sandbox HOME, on Linux + macOS. This is the
  # "the binaries have installers that work" gate. Windows installer verification
  # is the operator VM harness (tools/ce-installer-harness) against this tag.
  install-verify:
    needs: [meta, prerelease]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
          - os: macos
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: candidate/1.0.x
          persist-credentials: false
      - name: install.sh against the published pre-release (sandbox HOME)
        env:
          TAG: ${{ needs.meta.outputs.tag }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -eu
          # Sandbox: install.sh honours $HOME for ~/.mootx01/bin + ~/.local/bin.
          HOME="$(mktemp -d)"; export HOME
          # Linux install.sh fail-closes without minisign present; macOS skips it.
          [ "${{ matrix.os }}" = "linux" ] && { sudo apt-get update; sudo apt-get install -y minisign; }
          MOOTX01_VERSION="$TAG" sh install.sh
          out="$("$HOME/.mootx01/bin/mootx01" --version)"
          echo "installed --version: $out"
          case "$out" in
            "$VERSION"*) echo "✓ installer works (version matches)";;
            *) echo "✗ unexpected --version: $out (want $VERSION*)"; exit 1;;
          esac

          # A binary that runs is not a working install. On macOS, run the wiring
          # step (mootx01 install) and assert — from its OUTPUT, which is
          # home-agnostic (the CLI resolves the real user home, not $HOME) — that
          # it produces a REAL install: moot-mgr PLACES (no self-copy crash), and
          # both the resident daemon and the management console are registered.
          # This is the check that catches the moot-mgr self-copy crash and a
          # regression where the daemon is never registered (the .pkg symptom).
          # (launchctl bootstrap fails on a headless runner, so we assert the
          # registration was ATTEMPTED, not that the service is live — daemon
          # liveness needs a login session, i.e. the operator VM/machine.)
          if [ "${{ matrix.os }}" = "macos" ]; then
            # --target claude-code: a bare runner detects no clients, and
            # install exits at "No clients selected" BEFORE the daemon/console
            # registration this gate exists to verify. Pin one client so the
            # run is deterministic.
            out="$("$HOME/.mootx01/bin/mootx01" install --target claude-code --yes 2>&1)"; echo "$out"
            echo "$out" | grep -qi 'could not place moot-mgr' && { echo "✗ moot-mgr placement crashed"; exit 1; }
            echo "$out" | grep -qi 'resident.*daemon'   || { echo "✗ install never registered the resident daemon"; exit 1; }
            echo "$out" | grep -qi 'management console'  || { echo "✗ install never registered the moot-mgr console"; exit 1; }
            echo "✓ macOS: moot-mgr places; daemon + console registered"
            "$HOME/.mootx01/bin/mootx01" uninstall --yes >/dev/null 2>&1 || true
          fi

          sh install.sh --uninstall
          [ ! -e "$HOME/.mootx01" ] || { echo "✗ uninstall left ~/.mootx01"; exit 1; }
          echo "✓ ${{ matrix.os }} install → wire → run → uninstall clean"
