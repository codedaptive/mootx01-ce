name: DCO

# Developer Certificate of Origin gate.
#
# Every commit in a pull request must carry a `Signed-off-by:` trailer
# (`git commit -s`), which certifies DCO.md. The check reads the commits
# with git and needs no token, no secret, and no third-party action, so it
# runs with read-only permissions on the plain pull_request event.
#
# Make the "dco" status check required for merge in branch protection.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit carries Signed-off-by
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE".."$HEAD"); do
            if ! git log -1 --format=%B "$sha" | grep -Eq '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::$sha lacks a Signed-off-by trailer (git commit -s). See DCO.md."
              missing=1
            fi
          done
          exit $missing
