name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual debug trigger: COMPILE-ONLY. Builds a chosen platform from a branch
  # to catch build breaks fast, without tagging or the slow legs. It NEVER
  # signs, notarizes, uploads artifacts, or publishes: every Apple Developer ID
  # signing / notarization / upload step in the macOS jobs is gated
  # `if: startsWith(github.ref, 'refs/tags/')`, and the publish job is likewise push-only.
  # This is deliberate — a branch named like `v1.2.3` passes the release-version
  # regex, so gating on the tag string is NOT sufficient to keep branch-built
  # code out of the signing pipeline. The event type is the trust boundary.
  # (SECURITY 734e9908: branch-built macOS signing bypass.)
  #
  # Narrow exception: `winget-tag` re-runs ONLY the winget-pkgs submission for
  # an ALREADY-PUBLISHED release tag (assets exist on the GitHub release; no
  # building, no signing — wingetcreate just downloads the published EXEs and
  # opens the community PR). It exists because the submission can fail for
  # reasons independent of the release itself (matcher quirks, rate limits)
  # and re-pushing a tag to retry would re-run the entire pipeline.
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform(s) to build (manual debug runs only — does not publish)'
        type: choice
        default: all
        options:
          - all
          - macos
          - linux
          - windows-x64
          - windows-arm64
          - none
      winget-tag:
        description: 'Resubmit an existing published release tag (e.g. v1.0.27) to winget-pkgs. Combine with platform: none.'
        type: string
        default: ''

permissions:
  # Least-privilege default. The build jobs (swift/cargo) only need to READ the
  # repo, so the workflow-wide default is read — this keeps a write-capable
  # GITHUB_TOKEN out of jobs that run untrusted build code (cargo build scripts,
  # proc-macros, SwiftPM plugins). The jobs that genuinely write — `release`
  # (creates the GitHub release) and `update-winget` (pushes manifests) — raise
  # themselves to contents: write explicitly. Checkouts additionally set
  # persist-credentials: false so the token is never written into .git/config
  # where a build step could read it. (SECURITY: supply-chain write-token exposure.)
  contents: read

env:
  # The untrusted Git tag name is handed to steps as an environment variable.
  # It is NEVER interpolated as ${{ github.ref_name }} inside a `run:` script:
  # a tag like `v$(payload)` would then execute as a shell command substitution
  # on the runner — and the macOS jobs do so AFTER the Apple Developer ID signing
  # key is imported and unlocked, turning it into a code-signing/supply-chain
  # compromise. Steps read $RELEASE_TAG (a plain env value, not shell-evaluated)
  # and validate it against a strict release-version regex before use.
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  # ── macOS builds (arm64 + x86_64) ─────────────────────────────────────────
  build-macos-arm64:
    name: Build macOS arm64
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'macos' }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          # This job runs swift build (untrusted plugins/build tools). Don't
          # persist GITHUB_TOKEN into .git/config; the job also inherits
          # contents: read, so no write token exists for a build step to abuse.
          persist-credentials: false

      - name: Select Swift 6.2 toolchain (latest stable Xcode)
        # macos-26 carries the Swift 6.2 OS runtime the packages require; pair it
        # with the latest stable Xcode so the build toolchain and runtime match.
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: Show Swift version
        run: swift --version

      - name: Build release binaries
        run: |
          # mootx01 = MCP server + management CLI; moot-mgr = the management
          # console (resident host + loopback dashboard). The macOS moot-mgr is a
          # SwiftUI app (built here and on x86_64); Linux and Windows ship the
          # headless Rust moot-mgr (built in their respective jobs) — its control
          # channel is a Unix-domain socket on Unix and a named pipe on Windows.
          # SPM dependencies are public github.com packages and build without
          # auth injection (verified: candidate.yml omits this step and builds fine).
          swift build -c release --package-path apps/mootx01 --product mootx01
          swift build -c release --package-path apps/moot-mgr --product moot-mgr

      - name: Import Developer ID Certificate
        if: ${{ startsWith(github.ref, 'refs/tags/') && github.event_name == 'push' }}
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_SIGNING_CERT_P12 }}
          CERT_P12_PASSWORD: ${{ secrets.APPLE_SIGNING_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASS="$(openssl rand -base64 32)"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERT_P12_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          rm "$RUNNER_TEMP/cert.p12"

      - name: Sign binaries
        if: ${{ startsWith(github.ref, 'refs/tags/') && github.event_name == 'push' }}
        run: |
          IDENTITY="Developer ID Application: Codedaptive, LLC (${{ secrets.APPLE_TEAM_ID }})"
          MOOT_BIN="apps/mootx01/.build/arm64-apple-macosx/release/mootx01"
          MGR_BIN="apps/moot-mgr/.build/arm64-apple-macosx/release/moot-mgr"
          for bin in "$MOOT_BIN" "$MGR_BIN"; do
            test -f "$bin"
            test -x "$bin"
            file "$bin" | grep -E 'Mach-O.*arm64'
          done
          # sign-retry.sh: --timestamp contacts Apple's TSA; retry transient outages.
          bash distribution/macos/sign-retry.sh codesign --options runtime --timestamp --sign "$IDENTITY" "$MOOT_BIN"
          bash distribution/macos/sign-retry.sh codesign --options runtime --timestamp --sign "$IDENTITY" "$MGR_BIN"
          codesign --verify --deep --strict --verbose=2 "$MOOT_BIN"
          codesign --verify --deep --strict --verbose=2 "$MGR_BIN"
          echo "MOOT_BIN=$MOOT_BIN" >> "$GITHUB_ENV"
          echo "MGR_BIN=$MGR_BIN"  >> "$GITHUB_ENV"

      - name: Notarize binaries
        if: ${{ startsWith(github.ref, 'refs/tags/') && github.event_name == 'push' }}
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          mkdir -p ~/.private_keys
          echo "$APPLE_API_KEY_P8" | base64 --decode > \
            ~/.private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          zip -j "$RUNNER_TEMP/binaries.zip" "$MOOT_BIN" "$MGR_BIN"
          xcrun notarytool submit "$RUNNER_TEMP/binaries.zip" \
            --key ~/.private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8 \
            --key-id "${{ secrets.APPLE_API_KEY_ID }}" \
            --issuer "${{ secrets.APPLE_API_KEY_ISSUER }}" \
            --wait
          rm -f ~/.private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8

      - name: Package binaries
        if: ${{ startsWith(github.ref, 'refs/tags/') && github.event_name == 'push' }}
        run: |
          # Tag comes from $RELEASE_TAG (a plain env value, never templated into shell) and is
          # validated against a strict release-version regex before any use.
          VERSION="$RELEASE_TAG"
          if [[ ! "$VERSION" =~ ^v[0-9]+(\.[0-9]+){2}(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "mootx01: invalid release tag: $VERSION" >&2
            exit 1
          fi
          ASSET="mootx01-${VERSION}-macos-arm64.tar.gz"
          cp "$MOOT_BIN" mootx01
          cp "$MGR_BIN" moot-mgr
          # SPM resource bundles MUST ship beside the Swift binaries — each
          # Bundle.module target fatalErrors on first resource touch without
          # its <Target>_<Target>.bundle sibling (v1.0.9 shipped without
          # them; the installed CLI crashed on any classify/search path).
          # Bundles are plain resource data: not code-signed, inert to
          # notarization. Union of both products' bundles; a failing glob
          # (no bundles built) fails the job loudly, which is correct.
          rm -rf ./*.bundle
          cp -R "$(dirname "$MOOT_BIN")"/*.bundle .
          for b in "$(dirname "$MGR_BIN")"/*.bundle; do
            bn="$(basename "$b")"
            [ -e "./$bn" ] || cp -R "$b" .
          done
          tar -czf "${ASSET}" mootx01 moot-mgr ./*.bundle
          echo "ASSET=${ASSET}" >> "${GITHUB_ENV}"
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"

      - name: Upload asset
        if: ${{ startsWith(github.ref, 'refs/tags/') && github.event_name == 'push' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: macos-arm64
          path: ${{ env.ASSET }}

      # ── macOS .pkg installer (arm64) ────────────────────────────────────────
      # Build the Mootx01Setup SwiftUI assistant (apps/Mootx01-Setup), sign the
      # bare executable, assemble a signed+notarized .pkg via build-pkg.sh.
      #
      # Installer signing uses a DIFFERENT certificate class from binary signing:
      # "Developer ID Installer" (APPLE_INSTALLER_CERT_P12) rather than
      # "Developer ID Application" (APPLE_SIGNING_CERT_P12). The .app binary
      # inside the .pkg is codesigned with the application cert; productsign
      # wraps the whole .pkg with the installer cert.
      - name: Build setup assistant (arm64)
        if: ${{ startsWith(github.ref, 'refs/tags/') && github.event_name == 'push' }}
        run: |
          # Setup assistant links MootInstallerCore from apps/mootx01 via local
          # path dependency; both packages must be built for the same arch.
          swift build -c release --package-path apps/Mootx01-Setup --product Mootx01Setup
          SETUP_BIN="apps/Mootx01-Setup/.build/arm64-apple-macosx/release/Mootx01Setup"
          test -f "$SETUP_BIN"
          test -x "$SETUP_BIN"
          file "$SETUP_BIN" | grep -E 'Mach-O.*arm64'
          echo "SETUP_BIN=${SETUP_BIN}" >> "${GITHUB_ENV}"

      - name: Sign setup assistant (arm64)
        if: ${{ startsWith(github.ref, 'refs/tags/') && github.event_name == 'push' }}
        run: |
          # Codesign the bare executable before build-pkg.sh wraps it in the .app
          # bundle. Application cert (already loaded from prior keychain import step)
          # with runtime hardening so the bundle passes Gatekeeper.
          IDENTITY="Developer ID Application: Codedaptive, LLC (${{ secrets.APPLE_TEAM_ID }})"
          # sign-retry.sh: --timestamp contacts Apple's TSA; retry transient outages.
          bash distribution/macos/sign-retry.sh codesign --options runtime --timestamp --sign "$IDENTITY" "$SETUP_BIN"
          codesign --verify --deep --strict --verbose=2 "$SETUP_BIN"

      - name: Import Developer ID Installer Certificate (arm64)
        if: ${{ startsWith(github.ref, 'refs/tags/') && github.event_name == 'push' }}
        # The installer cert is a separate .p12 from the application signing cert;
        # it uses a dedicated second keychain so we don't need the original
        # build.keychain password. productsign will find the installer identity
        # in installer.keychain via the user keychain search list.
        # APPLE_INSTALLER_CERT_P12 and APPLE_INSTALLER_CERT_PASSWORD are the same
        # secret names used in the EE release workflow.
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_INSTALLER_CERT_P12 }}
          CERT_P12_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERT_PASSWORD }}
        run: |
          INST_KEYCHAIN="$RUNNER_TEMP/installer.keychain"
          INST_KEYCHAIN_PASS="$(openssl rand -base64 32)"
          security create-keychain -p "$INST_KEYCHAIN_PASS" "$INST_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$INST_KEYCHAIN"
          security unlock-keychain -p "$INST_KEYCHAIN_PASS" "$INST_KEYCHAIN"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/installer-cert.p12"
          security import "$RUNNER_TEMP/installer-cert.p12" \
            -k "$INST_KEYCHAIN" \
            -P "$CERT_P12_PASSWORD" \
            -T /usr/bin/productsign
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$INST_KEYCHAIN_PASS" "$INST_KEYCHAIN"
          # Add the installer keychain to the user search list so productsign finds it.
          security list-keychain -d user -s "$RUNNER_TEMP/build.keychain" "$INST_KEYCHAIN"
          rm "$RUNNER_TEMP/installer-cert.p12"

      - name: Build macOS .pkg installer (arm64)
        if: ${{ startsWith(github.ref, 'refs/tags/') && github.event_name == 'push' }}
        env:
          # Constructed inline from APPLE_TEAM_ID — same pattern as the EE
          # release workflow. No separate APPLE_INSTALLER_IDENTITY secret needed.
          INSTALLER_IDENTITY: "Developer ID Installer: Codedaptive, LLC (${{ secrets.APPLE_TEAM_ID }})"
          # Application identity seals the bundled Mootx01Setup.app (hardened
          # runtime) inside the .pkg so the package passes notarization.
          APP_IDENTITY: "Developer ID Application: Codedaptive, LLC (${{ secrets.APPLE_TEAM_ID }})"
          # Fail closed: a published .pkg must be signed (SECURITY 927f38c4).
          REQUIRE_SIGNING: "1"
        run: |
          # Strip leading 'v' from tag (build-pkg.sh uses version in filename).
          VERSION_NUM="${VERSION#v}"
          bash distribution/macos/build-pkg.sh \
            "${VERSION_NUM}" \
            arm64 \
            "${MOOT_BIN}" \
            "${MGR_BIN}" \
            "${SETUP_BIN}"
          PKG_ASSET="mootx01-${VERSION_NUM}-macos-arm64.pkg"
          echo "PKG_ASSET=${PKG_ASSET}" >> "${GITHUB_ENV}"

      - name: Notarize macOS .pkg (arm64)
        if: ${{ startsWith(github.ref, 'refs/tags/') && github.event_name == 'push' }}
        # Notarize the signed .pkg with Apple so Gatekeeper clears it on download.
        # Uses the same notarytool credentials as the binary notarization step above.
        # xcrun stapler staple embeds the notarization ticket into the .pkg so it
        # can be verified offline.
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_ISSUER: ${{ secrets.APPLE_API_KEY_ISSUER }}
        run: |
          mkdir -p ~/.private_keys
          KEYFILE=~/.private_keys/AuthKey_${APPLE_API_KEY_ID}.p8
          echo "$APPLE_API_KEY_P8" | base64 --decode > "$KEYFILE"
          # Submit and wait; capture the JSON so that on a non-Accepted verdict
          # we can fetch Apple's notary log, which names the exact rejected
          # component (otherwise the failure is an opaque "status: Invalid").
          SUBMIT_JSON="$(xcrun notarytool submit "${PKG_ASSET}" \
            --key "$KEYFILE" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_KEY_ISSUER" \
            --output-format json --wait)"
          echo "$SUBMIT_JSON"
          SUBMIT_ID="$(printf '%s' "$SUBMIT_JSON" | python3 -c 'import sys,json;print(json.load(sys.stdin)["id"])')"
          STATUS="$(printf '%s' "$SUBMIT_JSON" | python3 -c 'import sys,json;print(json.load(sys.stdin)["status"])')"
          if [ "$STATUS" != "Accepted" ]; then
            echo "::error::pkg notarization $STATUS — Apple notary log follows:"
            xcrun notarytool log "$SUBMIT_ID" \
              --key "$KEYFILE" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_KEY_ISSUER" || true
            rm -f "$KEYFILE"
            exit 1
          fi
          xcrun stapler staple "${PKG_ASSET}"
          rm -f "$KEYFILE"

      - name: Upload macOS .pkg installer (arm64)
        if: ${{ startsWith(github.ref, 'refs/tags/') && github.event_name == 'push' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: macos-arm64-pkg
          path: ${{ env.PKG_ASSET }}

  build-macos-x86_64:
    name: Build macOS x86_64
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'macos' }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          # See the arm64 job: no persisted write token in a swift-build job.
          persist-credentials: false

      - name: Select Swift 6.2 toolchain (latest stable Xcode)
        # See arm64 job: macos-26 ships the 6.2 runtime; latest-stable Xcode matches it.
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: Show Swift version
        run: swift --version

      - name: Build release binaries (cross-compile to x86_64)
        run: |
          # Both binaries cross-compiled to x86_64; see the arm64 job for the
          # mootx01/moot-mgr split rationale (macOS moot-mgr = SwiftUI app).
          swift build -c release --package-path apps/mootx01 --product mootx01 --arch x86_64
          swift build -c release --package-path apps/moot-mgr --product moot-mgr --arch x86_64

      - name: Import Developer ID Certificate
        if: ${{ startsWith(github.ref, 'refs/tags/') && github.event_name == 'push' }}
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_SIGNING_CERT_P12 }}
          CERT_P12_PASSWORD: ${{ secrets.APPLE_SIGNING_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASS="$(openssl rand -base64 32)"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERT_P12_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          rm "$RUNNER_TEMP/cert.p12"

      - name: Sign binaries
        if: ${{ startsWith(github.ref, 'refs/tags/') && github.event_name == 'push' }}
        run: |
          IDENTITY="Developer ID Application: Codedaptive, LLC (${{ secrets.APPLE_TEAM_ID }})"
          MOOT_BIN="apps/mootx01/.build/x86_64-apple-macosx/release/mootx01"
          MGR_BIN="apps/moot-mgr/.build/x86_64-apple-macosx/release/moot-mgr"
          for bin in "$MOOT_BIN" "$MGR_BIN"; do
            test -f "$bin"
            test -x "$bin"
            file "$bin" | grep -E 'Mach-O.*x86_64'
          done
          # sign-retry.sh: --timestamp contacts Apple's TSA; retry transient outages.
          bash distribution/macos/sign-retry.sh codesign --options runtime --timestamp --sign "$IDENTITY" "$MOOT_BIN"
          bash distribution/macos/sign-retry.sh codesign --options runtime --timestamp --sign "$IDENTITY" "$MGR_BIN"
          codesign --verify --deep --strict --verbose=2 "$MOOT_BIN"
          codesign --verify --deep --strict --verbose=2 "$MGR_BIN"
          echo "MOOT_BIN=$MOOT_BIN" >> "$GITHUB_ENV"
          echo "MGR_BIN=$MGR_BIN"  >> "$GITHUB_ENV"

      - name: Notarize binaries
        if: ${{ startsWith(github.ref, 'refs/tags/') && github.event_name == 'push' }}
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          mkdir -p ~/.private_keys
          echo "$APPLE_API_KEY_P8" | base64 --decode > \
            ~/.private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          zip -j "$RUNNER_TEMP/binaries.zip" "$MOOT_BIN" "$MGR_BIN"
          xcrun notarytool submit "$RUNNER_TEMP/binaries.zip" \
            --key ~/.private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8 \
            --key-id "${{ secrets.APPLE_API_KEY_ID }}" \
            --issuer "${{ secrets.APPLE_API_KEY_ISSUER }}" \
            --wait
          rm -f ~/.private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8

      - name: Package binaries
        if: ${{ startsWith(github.ref, 'refs/tags/') && github.event_name == 'push' }}
        run: |
          # Tag comes from $RELEASE_TAG (a plain env value, never templated into shell) and is
          # validated against a strict release-version regex before any use.
          VERSION="$RELEASE_TAG"
          if [[ ! "$VERSION" =~ ^v[0-9]+(\.[0-9]+){2}(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "mootx01: invalid release tag: $VERSION" >&2
            exit 1
          fi
          ASSET="mootx01-${VERSION}-macos-x86_64.tar.gz"
          cp "$MOOT_BIN" mootx01
          cp "$MGR_BIN" moot-mgr
          # SPM resource bundles MUST ship beside the Swift binaries — see
          # the arm64 job's identical step for the full rationale (v1.0.9
          # shipped without them; installed CLI crashed on resource touch).
          rm -rf ./*.bundle
          cp -R "$(dirname "$MOOT_BIN")"/*.bundle .
          for b in "$(dirname "$MGR_BIN")"/*.bundle; do
            bn="$(basename "$b")"
            [ -e "./$bn" ] || cp -R "$b" .
          done
          tar -czf "${ASSET}" mootx01 moot-mgr ./*.bundle
          echo "ASSET=${ASSET}" >> "${GITHUB_ENV}"
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"

      - name: Upload asset
        if: ${{ startsWith(github.ref, 'refs/tags/') && github.event_name == 'push' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: macos-x86_64
          path: ${{ env.ASSET }}

      # ── macOS .pkg installer (x86_64) ───────────────────────────────────────
      # Cross-compiled x86_64 build; same pattern as the arm64 .pkg job above.
      # The Mootx01-Setup package is also cross-compiled with --arch x86_64 so
      # the setup binary matches the installed CLI arch on Intel Macs.
      - name: Build setup assistant (x86_64)
        if: ${{ startsWith(github.ref, 'refs/tags/') && github.event_name == 'push' }}
        run: |
          swift build -c release --package-path apps/Mootx01-Setup --product Mootx01Setup --arch x86_64
          SETUP_BIN="apps/Mootx01-Setup/.build/x86_64-apple-macosx/release/Mootx01Setup"
          test -f "$SETUP_BIN"
          test -x "$SETUP_BIN"
          file "$SETUP_BIN" | grep -E 'Mach-O.*x86_64'
          echo "SETUP_BIN=${SETUP_BIN}" >> "${GITHUB_ENV}"

      - name: Sign setup assistant (x86_64)
        if: ${{ startsWith(github.ref, 'refs/tags/') && github.event_name == 'push' }}
        run: |
          IDENTITY="Developer ID Application: Codedaptive, LLC (${{ secrets.APPLE_TEAM_ID }})"
          # sign-retry.sh: --timestamp contacts Apple's TSA; retry transient outages.
          bash distribution/macos/sign-retry.sh codesign --options runtime --timestamp --sign "$IDENTITY" "$SETUP_BIN"
          codesign --verify --deep --strict --verbose=2 "$SETUP_BIN"

      - name: Import Developer ID Installer Certificate (x86_64)
        if: ${{ startsWith(github.ref, 'refs/tags/') && github.event_name == 'push' }}
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_INSTALLER_CERT_P12 }}
          CERT_P12_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERT_PASSWORD }}
        run: |
          INST_KEYCHAIN="$RUNNER_TEMP/installer.keychain"
          INST_KEYCHAIN_PASS="$(openssl rand -base64 32)"
          security create-keychain -p "$INST_KEYCHAIN_PASS" "$INST_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$INST_KEYCHAIN"
          security unlock-keychain -p "$INST_KEYCHAIN_PASS" "$INST_KEYCHAIN"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/installer-cert.p12"
          security import "$RUNNER_TEMP/installer-cert.p12" \
            -k "$INST_KEYCHAIN" \
            -P "$CERT_P12_PASSWORD" \
            -T /usr/bin/productsign
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$INST_KEYCHAIN_PASS" "$INST_KEYCHAIN"
          security list-keychain -d user -s "$RUNNER_TEMP/build.keychain" "$INST_KEYCHAIN"
          rm "$RUNNER_TEMP/installer-cert.p12"

      - name: Build macOS .pkg installer (x86_64)
        if: ${{ startsWith(github.ref, 'refs/tags/') && github.event_name == 'push' }}
        env:
          INSTALLER_IDENTITY: "Developer ID Installer: Codedaptive, LLC (${{ secrets.APPLE_TEAM_ID }})"
          # Application identity seals the bundled Mootx01Setup.app (hardened
          # runtime) inside the .pkg so the package passes notarization.
          APP_IDENTITY: "Developer ID Application: Codedaptive, LLC (${{ secrets.APPLE_TEAM_ID }})"
          # Fail closed: a published .pkg must be signed (SECURITY 927f38c4).
          REQUIRE_SIGNING: "1"
        run: |
          VERSION_NUM="${VERSION#v}"
          bash distribution/macos/build-pkg.sh \
            "${VERSION_NUM}" \
            x86_64 \
            "${MOOT_BIN}" \
            "${MGR_BIN}" \
            "${SETUP_BIN}"
          PKG_ASSET="mootx01-${VERSION_NUM}-macos-x86_64.pkg"
          echo "PKG_ASSET=${PKG_ASSET}" >> "${GITHUB_ENV}"

      - name: Notarize macOS .pkg (x86_64)
        if: ${{ startsWith(github.ref, 'refs/tags/') && github.event_name == 'push' }}
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_ISSUER: ${{ secrets.APPLE_API_KEY_ISSUER }}
        run: |
          mkdir -p ~/.private_keys
          KEYFILE=~/.private_keys/AuthKey_${APPLE_API_KEY_ID}.p8
          echo "$APPLE_API_KEY_P8" | base64 --decode > "$KEYFILE"
          # Submit and wait; capture the JSON so that on a non-Accepted verdict
          # we can fetch Apple's notary log, which names the exact rejected
          # component (otherwise the failure is an opaque "status: Invalid").
          SUBMIT_JSON="$(xcrun notarytool submit "${PKG_ASSET}" \
            --key "$KEYFILE" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_KEY_ISSUER" \
            --output-format json --wait)"
          echo "$SUBMIT_JSON"
          SUBMIT_ID="$(printf '%s' "$SUBMIT_JSON" | python3 -c 'import sys,json;print(json.load(sys.stdin)["id"])')"
          STATUS="$(printf '%s' "$SUBMIT_JSON" | python3 -c 'import sys,json;print(json.load(sys.stdin)["status"])')"
          if [ "$STATUS" != "Accepted" ]; then
            echo "::error::pkg notarization $STATUS — Apple notary log follows:"
            xcrun notarytool log "$SUBMIT_ID" \
              --key "$KEYFILE" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_KEY_ISSUER" || true
            rm -f "$KEYFILE"
            exit 1
          fi
          xcrun stapler staple "${PKG_ASSET}"
          rm -f "$KEYFILE"

      - name: Upload macOS .pkg installer (x86_64)
        if: ${{ startsWith(github.ref, 'refs/tags/') && github.event_name == 'push' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: macos-x86_64-pkg
          path: ${{ env.PKG_ASSET }}

  # ── Linux builds (x86_64 + arm64) ─────────────────────────────────────────
  # Linux ships the Rust CLI from apps/mootx01/rust (NOT the Swift installer —
  # Swift has no Linux GUI, and the Swift package's non-macOS branch omits
  # `serve`). The Rust binary is the complete CLI: install, db, status, query,
  # proxy, serve, uninstall, upgrade. Verified green by rust-cli.yml.
  build-linux-x86_64:
    name: Build Linux x86_64
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'linux' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          # cargo build runs untrusted build scripts/proc-macros; keep the write
          # token out of .git/config (job also inherits contents: read).
          persist-credentials: false

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/mootx01/rust/target
          key: release-rust-linux-x86_64-${{ hashFiles('apps/mootx01/rust/Cargo.toml') }}
          restore-keys: release-rust-linux-x86_64-

      - name: Build release binaries
        run: |
          cargo build --release --locked --manifest-path apps/mootx01/rust/Cargo.toml
          cargo build --release --locked --manifest-path apps/moot-mgr/rust/Cargo.toml

      - name: Package binaries
        run: |
          # Tag comes from $RELEASE_TAG (a plain env value, never templated into shell) and is
          # validated against a strict release-version regex before any use.
          VERSION="$RELEASE_TAG"
          if [[ ! "$VERSION" =~ ^v[0-9]+(\.[0-9]+){2}(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "mootx01: invalid release tag: $VERSION" >&2
            exit 1
          fi
          ASSET="mootx01-${VERSION}-linux-x86_64.tar.gz"
          cp apps/mootx01/rust/target/release/mootx01 mootx01
          cp apps/moot-mgr/rust/target/release/moot-mgr moot-mgr
          tar -czf "${ASSET}" mootx01 moot-mgr
          echo "ASSET=${ASSET}" >> "${GITHUB_ENV}"

      - name: Upload asset
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: linux-x86_64
          path: ${{ env.ASSET }}

  build-linux-arm64:
    name: Build Linux arm64
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'linux' }}
    # GitHub-hosted arm64 Linux label is `ubuntu-22.04-arm` (no `-arm64` suffix);
    # the old `ubuntu-22.04-arm64` matched no runner and queued forever.
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          # cargo build runs untrusted build scripts/proc-macros; keep the write
          # token out of .git/config (job also inherits contents: read).
          persist-credentials: false

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/mootx01/rust/target
          key: release-rust-linux-arm64-${{ hashFiles('apps/mootx01/rust/Cargo.toml') }}
          restore-keys: release-rust-linux-arm64-

      - name: Build release binaries
        run: |
          cargo build --release --locked --manifest-path apps/mootx01/rust/Cargo.toml
          cargo build --release --locked --manifest-path apps/moot-mgr/rust/Cargo.toml

      - name: Package binaries
        run: |
          # Tag comes from $RELEASE_TAG (a plain env value, never templated into shell) and is
          # validated against a strict release-version regex before any use.
          VERSION="$RELEASE_TAG"
          if [[ ! "$VERSION" =~ ^v[0-9]+(\.[0-9]+){2}(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "mootx01: invalid release tag: $VERSION" >&2
            exit 1
          fi
          ASSET="mootx01-${VERSION}-linux-arm64.tar.gz"
          cp apps/mootx01/rust/target/release/mootx01 mootx01
          cp apps/moot-mgr/rust/target/release/moot-mgr moot-mgr
          tar -czf "${ASSET}" mootx01 moot-mgr
          echo "ASSET=${ASSET}" >> "${GITHUB_ENV}"

      - name: Upload asset
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: linux-arm64
          path: ${{ env.ASSET }}

  # ── Windows build (x86_64) ────────────────────────────────────────────────
  # Windows ships the Rust CLI from apps/mootx01/rust — the complete install/db/
  # status/query/proxy/serve/uninstall/upgrade surface — AND the Rust moot-mgr
  # console (apps/moot-mgr/rust), whose control channel is a named pipe on Windows.
  # NOT the ARIA MCP server (packages/kits/AriaMcpKit/rust) which is an internal
  # library, not the user-facing CLI.
  build-windows-x86_64:
    name: Build Windows x86_64
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'windows-x64' }}
    runs-on: windows-latest
    # Untrusted build job: cargo build runs Rust build-scripts, proc-macros, and
    # dependency code — arbitrary code — so this job holds NO OIDC capability.
    # contents: read only; NO id-token. The signing credential (OIDC → Azure) is
    # isolated in sign-windows-x86_64, which runs no build code. This keeps
    # code-signing capability unreachable from compromised build execution.
    # (SECURITY: isolate signing OIDC from untrusted cargo build.)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          # cargo build runs untrusted build scripts/proc-macros; keep even the
          # read-scoped token out of .git/config for good measure.
          persist-credentials: false

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/mootx01/rust/target
            apps/moot-mgr/rust/target
          key: release-rust-windows-x86_64-${{ hashFiles('apps/mootx01/rust/Cargo.toml', 'apps/moot-mgr/rust/Cargo.toml') }}
          restore-keys: release-rust-windows-x86_64-

      - name: Build release binaries
        run: |
          cargo build --release --locked --manifest-path apps/mootx01/rust/Cargo.toml --target x86_64-pc-windows-msvc
          cargo build --release --locked --manifest-path apps/moot-mgr/rust/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Stage binaries
        shell: pwsh
        run: |
          # Tag comes from $env:RELEASE_TAG (a plain env value, never templated into shell) and is
          # validated against a strict release-version regex before any use.
          $version = $env:RELEASE_TAG
          if ($version -notmatch '^v[0-9]+(\.[0-9]+){2}(-[0-9A-Za-z.-]+)?$') {
            Write-Error "mootx01: invalid release tag: $version"
            exit 1
          }
          # Copy both exes to the workspace root so they upload as a flat artifact.
          # sign-windows-x86_64 downloads them, signs them (when creds present),
          # and embeds the signed exes in the zip and the installer.
          Copy-Item "apps/mootx01/rust/target/x86_64-pc-windows-msvc/release/mootx01.exe" "mootx01.exe"
          Copy-Item "apps/moot-mgr/rust/target/x86_64-pc-windows-msvc/release/moot-mgr.exe" "moot-mgr.exe"

      - name: Smoke test
        shell: pwsh
        run: |
          # windows-latest is native x86_64, so the freshly built exe runs here.
          .\mootx01.exe --version

      - name: Upload unsigned binaries
        # Hand the unsigned exes to sign-windows-x86_64. This build job holds no
        # signing capability; the sign job is where OIDC/Azure signing happens.
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: windows-x86_64-unsigned
          path: |
            mootx01.exe
            moot-mgr.exe

  # ── Windows code signing + installer (x86_64) ─────────────────────────────
  # Trusted, cargo-free sign job. Holds the OIDC id-token capability for Azure
  # code signing and runs NO cargo build. Downloads the unsigned exes built by
  # build-windows-x86_64, signs them (when Azure is provisioned), builds the
  # Inno setup.exe, signs that, and uploads the final zip + setup.exe. Isolating
  # OIDC here — away from any build-time code — is the supply-chain fix: untrusted
  # Rust build code can never reach the signing credential or mint an OIDC token.
  sign-windows-x86_64:
    name: Sign Windows x86_64
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'windows-x64' }}
    needs: build-windows-x86_64
    runs-on: windows-latest
    permissions:
      id-token: write   # Azure OIDC login for code signing
      contents: read    # checkout the .iss installer script
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          # No cargo here, but this job holds id-token: write — never persist a
          # git token into .git/config alongside the signing capability.
          persist-credentials: false

      - name: Download unsigned binaries
        # Places mootx01.exe + moot-mgr.exe at the workspace root (where the zip
        # and ISCC's /DBinDir expect them).
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: windows-x86_64-unsigned
          path: .

      - name: Derive version
        shell: pwsh
        run: |
          # Re-derive from $env:RELEASE_TAG (validated, never shell-templated) —
          # the build job's env does not cross the job boundary. VERSION_NUM feeds
          # the Inno Setup step below.
          $version = $env:RELEASE_TAG
          if ($version -notmatch '^v[0-9]+(\.[0-9]+){2}(-[0-9A-Za-z.-]+)?$') {
            Write-Error "mootx01: invalid release tag: $version"
            exit 1
          }
          "VERSION_NUM=$($version.TrimStart('v'))" | Out-File -FilePath $env:GITHUB_ENV -Append

      # ── Windows code signing (Azure Artifact Signing) ────────────────────────
      # Signs the two exes here and the Inno setup.exe after it is built. Gated on
      # a real tag push (the trust boundary — matches the macOS jobs) AND on the
      # OIDC creds being present. Until Azure is provisioned the preflight leaves
      # SIGNING_READY unset and the release ships UNSIGNED Windows artifacts, as it
      # does today; once the first signed release is verified, tighten the preflight
      # to fail closed. Provisioning steps: distribution/windows/SIGNING.md.
      - name: Azure signing preflight
        if: ${{ startsWith(github.ref, 'refs/tags/') && github.event_name == 'push' }}
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          if ([string]::IsNullOrEmpty($env:AZURE_CLIENT_ID)) {
            Write-Output "::warning::AZURE_CLIENT_ID not set — Windows release artifacts will be UNSIGNED."
          } else {
            "SIGNING_READY=1" | Out-File -FilePath $env:GITHUB_ENV -Append
          }
      - name: Azure login
        if: ${{ env.SIGNING_READY == '1' }}
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign binaries
        if: ${{ env.SIGNING_READY == '1' }}
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ secrets.AZURE_CODESIGN_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_CODESIGN_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CODESIGN_PROFILE }}
          file-digest: SHA256
          # Explicit paths (not a folder filter) so only these two exes sign here.
          files: |
            ${{ github.workspace }}\mootx01.exe
            ${{ github.workspace }}\moot-mgr.exe

      - name: Package binaries
        shell: pwsh
        run: |
          # Zips the (now-signed when creds present) exes. RELEASE_TAG was validated
          # in Derive version above; the job would have failed there if malformed.
          $asset = "mootx01-$($env:RELEASE_TAG)-windows-x86_64.zip"
          Compress-Archive -Path "mootx01.exe", "moot-mgr.exe" -DestinationPath $asset
          "ASSET=$asset" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload asset
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: windows-x86_64
          path: ${{ env.ASSET }}

      # ── Windows Inno Setup installer (x86_64) ───────────────────────────────
      # Compiles distribution/windows/mootx01-setup.iss with ISCC (the Inno Setup
      # compiler) to produce a single-file mootx01-<version>-windows-x86_64-setup.exe
      # that installs mootx01.exe + moot-mgr.exe into %USERAPPDATA%\.mootx01\bin,
      # adds them to the user PATH, and runs `mootx01 install` post-install.
      #
      # BinDir=. — the "Download unsigned binaries" step above placed both .exe
      # files at the workspace root, so ISCC can find them at ".".
      #
      # Inno Setup is installed via Chocolatey; windows-latest runners include
      # Chocolatey but not ISCC itself. The choco install takes ~30 s.
      - name: Install Inno Setup (x86_64)
        run: choco install innosetup -y --no-progress

      - name: Build Windows setup installer (x86_64)
        shell: pwsh
        run: |
          # ISCC is the command-line Inno Setup compiler. After the choco install
          # it lives at C:\Program Files (x86)\Inno Setup 6\ISCC.exe.
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $versionNum = $env:VERSION_NUM
          # BinDir must be an absolute path: ISCC resolves /DBinDir relative to the
          # .iss file's SourceDir (distribution\windows\), not the caller's CWD.
          # Passing $($PWD.Path) (workspace root absolute path) means
          # {#BinDir}\mootx01.exe resolves to the exes placed there by the
          # "Download unsigned binaries" step above.
          # /O. — output the setup.exe into the workspace root (caller's CWD).
          & $iscc `
            "/DMyAppVersion=$versionNum" `
            "/DArch=x86_64" `
            "/DBinDir=$($PWD.Path)" `
            "/O." `
            "distribution/windows/mootx01-setup.iss"
          # The .iss OutputBaseFilename produces: mootx01-<version>-windows-x86_64-setup.exe
          $setupAsset = "mootx01-${versionNum}-windows-x86_64-setup.exe"
          "SETUP_ASSET=$setupAsset" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Sign setup installer (x86_64)
        if: ${{ env.SIGNING_READY == '1' }}
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ secrets.AZURE_CODESIGN_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_CODESIGN_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CODESIGN_PROFILE }}
          file-digest: SHA256
          files: ${{ github.workspace }}\${{ env.SETUP_ASSET }}

      - name: Upload Windows setup installer (x86_64)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: windows-x86_64-setup
          path: ${{ env.SETUP_ASSET }}

  # ── Windows build (arm64) ─────────────────────────────────────────────────
  # Native arm64 Windows build on the windows-11-arm runner — the same Rust CLI
  # (apps/mootx01/rust) + Rust console (apps/moot-mgr/rust) as the x86_64 job,
  # for Snapdragon-class Windows-on-ARM machines.
  build-windows-arm64:
    name: Build Windows arm64
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'windows-arm64' }}
    runs-on: windows-11-arm
    # Untrusted build job: cargo runs arbitrary Rust build code, so it holds NO
    # OIDC capability. contents: read only; signing OIDC is isolated in
    # sign-windows-arm64. (SECURITY: isolate signing OIDC from untrusted cargo.)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          # cargo build runs untrusted build scripts/proc-macros; keep even the
          # read-scoped token out of .git/config for good measure.
          persist-credentials: false

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/mootx01/rust/target
            apps/moot-mgr/rust/target
          key: release-rust-windows-arm64-${{ hashFiles('apps/mootx01/rust/Cargo.toml', 'apps/moot-mgr/rust/Cargo.toml') }}
          restore-keys: release-rust-windows-arm64-

      - name: Build release binaries
        run: |
          cargo build --release --locked --manifest-path apps/mootx01/rust/Cargo.toml --target aarch64-pc-windows-msvc
          cargo build --release --locked --manifest-path apps/moot-mgr/rust/Cargo.toml --target aarch64-pc-windows-msvc

      - name: Stage binaries
        shell: pwsh
        run: |
          # Tag comes from $env:RELEASE_TAG (a plain env value, never templated into shell) and is
          # validated against a strict release-version regex before any use.
          $version = $env:RELEASE_TAG
          if ($version -notmatch '^v[0-9]+(\.[0-9]+){2}(-[0-9A-Za-z.-]+)?$') {
            Write-Error "mootx01: invalid release tag: $version"
            exit 1
          }
          # Copy both exes to the workspace root so they upload as a flat artifact.
          # sign-windows-arm64 downloads them, signs them (when creds present),
          # and embeds the signed exes in the zip and the installer.
          Copy-Item "apps/mootx01/rust/target/aarch64-pc-windows-msvc/release/mootx01.exe" "mootx01.exe"
          Copy-Item "apps/moot-mgr/rust/target/aarch64-pc-windows-msvc/release/moot-mgr.exe" "moot-mgr.exe"

      - name: Smoke test
        shell: pwsh
        run: |
          # windows-11-arm is native arm64, so the freshly built exe runs here.
          .\mootx01.exe --version

      - name: Upload unsigned binaries
        # Hand the unsigned exes to sign-windows-arm64. This build job holds no
        # signing capability; the sign job is where OIDC/Azure signing happens.
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: windows-arm64-unsigned
          path: |
            mootx01.exe
            moot-mgr.exe

  # ── Windows code signing + installer (arm64) ──────────────────────────────
  # Trusted, cargo-free sign job (see sign-windows-x86_64 for the full rationale).
  # Holds the OIDC id-token capability; downloads the unsigned arm64 exes, signs
  # them (when provisioned), builds and signs the Inno setup.exe, uploads finals.
  sign-windows-arm64:
    name: Sign Windows arm64
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'windows-arm64' }}
    needs: build-windows-arm64
    runs-on: windows-11-arm
    permissions:
      id-token: write   # Azure OIDC login for code signing
      contents: read    # checkout the .iss installer script
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          # No cargo here, but this job holds id-token: write — never persist a
          # git token into .git/config alongside the signing capability.
          persist-credentials: false

      - name: Download unsigned binaries
        # Places mootx01.exe + moot-mgr.exe at the workspace root (where the zip
        # and ISCC's /DBinDir expect them).
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: windows-arm64-unsigned
          path: .

      - name: Derive version
        shell: pwsh
        run: |
          # Re-derive from $env:RELEASE_TAG (validated, never shell-templated) —
          # the build job's env does not cross the job boundary. VERSION_NUM feeds
          # the Inno Setup step below.
          $version = $env:RELEASE_TAG
          if ($version -notmatch '^v[0-9]+(\.[0-9]+){2}(-[0-9A-Za-z.-]+)?$') {
            Write-Error "mootx01: invalid release tag: $version"
            exit 1
          }
          "VERSION_NUM=$($version.TrimStart('v'))" | Out-File -FilePath $env:GITHUB_ENV -Append

      # ── Windows code signing (Azure Artifact Signing) ────────────────────────
      # Same as the x86_64 sign job. Gated on a real tag push AND the OIDC creds
      # being present; ships UNSIGNED until Azure is provisioned. NOTE: the signing
      # tool runs under x64 emulation on windows-11-arm (like Inno Setup 6, below) —
      # the first arm64 candidate build is where to confirm it signs cleanly.
      # Provisioning steps: distribution/windows/SIGNING.md.
      - name: Azure signing preflight
        if: ${{ startsWith(github.ref, 'refs/tags/') && github.event_name == 'push' }}
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          if ([string]::IsNullOrEmpty($env:AZURE_CLIENT_ID)) {
            Write-Output "::warning::AZURE_CLIENT_ID not set — Windows release artifacts will be UNSIGNED."
          } else {
            "SIGNING_READY=1" | Out-File -FilePath $env:GITHUB_ENV -Append
          }
      - name: Azure login
        if: ${{ env.SIGNING_READY == '1' }}
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign binaries
        if: ${{ env.SIGNING_READY == '1' }}
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ secrets.AZURE_CODESIGN_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_CODESIGN_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CODESIGN_PROFILE }}
          file-digest: SHA256
          # Explicit paths (not a folder filter) so only these two exes sign here.
          files: |
            ${{ github.workspace }}\mootx01.exe
            ${{ github.workspace }}\moot-mgr.exe

      - name: Package binaries
        shell: pwsh
        run: |
          # Zips the (now-signed when creds present) exes. RELEASE_TAG was validated
          # in Derive version above; the job would have failed there if malformed.
          $asset = "mootx01-$($env:RELEASE_TAG)-windows-arm64.zip"
          Compress-Archive -Path "mootx01.exe", "moot-mgr.exe" -DestinationPath $asset
          "ASSET=$asset" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload asset
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: windows-arm64
          path: ${{ env.ASSET }}

      # ── Windows Inno Setup installer (arm64) ────────────────────────────────
      # Same pattern as the x86_64 Inno Setup steps above. The .iss script is
      # arch-agnostic; /DArch=arm64 is passed so the output filename and the
      # installed app directory embed the correct architecture label.
      #
      # NOTE: windows-11-arm runners ship Chocolatey but Inno Setup 6 publishes
      # only an x86 installer — it runs under x86 emulation on arm64 Windows
      # (supported on Snapdragon), so `choco install innosetup` is safe here.
      - name: Install Inno Setup (arm64)
        run: choco install innosetup -y --no-progress

      - name: Build Windows setup installer (arm64)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $versionNum = $env:VERSION_NUM
          # BinDir must be absolute — same reason as the x86_64 job above:
          # ISCC resolves /DBinDir relative to the .iss file's SourceDir, not CWD.
          # The exes it embeds were placed at the workspace root by the
          # "Download unsigned binaries" step above.
          & $iscc `
            "/DMyAppVersion=$versionNum" `
            "/DArch=arm64" `
            "/DBinDir=$($PWD.Path)" `
            "/O." `
            "distribution/windows/mootx01-setup.iss"
          $setupAsset = "mootx01-${versionNum}-windows-arm64-setup.exe"
          "SETUP_ASSET=$setupAsset" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Sign setup installer (arm64)
        if: ${{ env.SIGNING_READY == '1' }}
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ secrets.AZURE_CODESIGN_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_CODESIGN_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CODESIGN_PROFILE }}
          file-digest: SHA256
          files: ${{ github.workspace }}\${{ env.SETUP_ASSET }}

      - name: Upload Windows setup installer (arm64)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: windows-arm64-setup
          path: ${{ env.SETUP_ASSET }}

  # ── Create GitHub release + attach assets ──────────────────────────────────
  release:
    name: Create Release
    # Publish only on a real tag push. Manual debug runs build a subset and
    # never publish (and would have skipped 'needs' jobs anyway).
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs:
      - build-macos-arm64
      - build-macos-x86_64
      - build-linux-x86_64
      - build-linux-arm64
      # Windows: depend on the SIGN jobs (they need the build jobs); the final
      # zip + setup.exe artifacts are produced by sign-windows-*, not build-*.
      - sign-windows-x86_64
      - sign-windows-arm64
    # ubuntu-24.04 (not 22.04): the minisign package is only in the universe
    # repository from Ubuntu 23.10 onward, so it cannot be apt-installed on
    # jammy. The Linux *binary* build jobs stay on 22.04 for broader glibc
    # compatibility; only this publish job needs the newer image.
    runs-on: ubuntu-24.04
    # This job creates the GitHub release (softprops/action-gh-release via the
    # GITHUB_TOKEN), which requires write. Declared explicitly because the
    # workflow-wide default is now contents: read (least privilege).
    permissions:
      contents: write
    steps:
      # Checkout MUST precede the artifact download: actions/checkout cleans its
      # working directory, so running it after the download would delete the
      # just-downloaded assets/ tree. Checkout first (for distribution/minisign.pub),
      # then populate assets/.
      - name: Checkout repository (for bundled public key)
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          # The release is created via the GitHub API (action-gh-release, using
          # the GITHUB_TOKEN env), not via git push — so nothing here needs the
          # token persisted in .git/config.
          persist-credentials: false

      - name: Download all assets
        # Downloads every artifact uploaded by the build jobs into assets/<name>/.
        # This includes the new installer artifacts (macos-arm64-pkg,
        # macos-x86_64-pkg, windows-x86_64-setup, windows-arm64-setup) alongside
        # the existing binary archives.
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: assets

      - name: Generate checksums.txt
        working-directory: assets
        run: |
          # Collect all release files from artifact subdirs into one flat dir.
          # Covers binary archives (*.tar.gz, *.zip), macOS .pkg installers,
          # and Windows setup .exe installers so the checksum file covers all
          # release assets and the minisign signature below seals the full set.
          mkdir -p flat
          find . \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.pkg' -o -name '*.exe' \) \
            | xargs -I{} cp {} flat/
          # Stable version-less aliases for the website: asset names embed the
          # version, so a hardcoded link breaks every release. These copies
          # make .../releases/latest/download/mootx01-<platform>.<ext> a
          # permanent URL. Added BEFORE checksum generation so the aliases are
          # sealed by checksums.txt + the minisign signature like any other
          # asset. Windows: winget is the primary web route, but the direct
          # setup.exe link covers machines without App Installer. The setup.exe is
          # Authenticode-signed via Azure Artifact Signing when signing creds are
          # configured (distribution/windows/SIGNING.md); an unsigned build (creds
          # absent) still trips SmartScreen on direct download.
          for f in flat/mootx01-*-macos-arm64.pkg;          do cp "$f" flat/mootx01-macos-arm64.pkg;          done
          for f in flat/mootx01-*-macos-x86_64.pkg;         do cp "$f" flat/mootx01-macos-x86_64.pkg;         done
          for f in flat/mootx01-*-windows-arm64-setup.exe;  do cp "$f" flat/mootx01-windows-arm64-setup.exe;  done
          for f in flat/mootx01-*-windows-x86_64-setup.exe; do cp "$f" flat/mootx01-windows-x86_64-setup.exe; done
          cd flat
          sha256sum * > ../checksums.txt

      # ── Minisign signature (CAND-004) ──────────────────────────────────────
      # Signs checksums.txt with the project's Ed25519 private key, producing
      # checksums.txt.minisig. The .minisig file is uploaded as a release asset
      # alongside checksums.txt; Linux/POSIX installers (`install.sh`) and the
      # `mootx01 upgrade` command download and verify it against the public key
      # bundled at distribution/minisign.pub in the repository.
      #
      # OPERATOR ACTION REQUIRED to activate:
      #   1. Generate a keypair:
      #        minisign -G -p distribution/minisign.pub -s /path/to/minisign.sec
      #   2. Replace any PLACEHOLDER content in distribution/minisign.pub with the
      #      generated public key and commit it.
      #   3. Add two GitHub repository secrets:
      #        MINISIGN_SECRET_KEY          — contents of /path/to/minisign.sec
      #        MINISIGN_SECRET_KEY_PASSWORD — passphrase (empty string if none)
      #
      # These secrets ARE populated (the project ships signed releases). This
      # step now FAILS CLOSED (SECURITY 927f38c4): a release that reaches the
      # publish job without a configured signing key aborts rather than
      # shipping unsigned checksums, since Linux/POSIX installers fail closed
      # on a missing .minisig and would break for every user.
      - name: Sign checksums with minisign (CAND-004)
        # NOTE: GitHub Actions forbids referencing `secrets` in a step-level
        # `if:` conditional, so the secret-present check is done INSIDE the
        # script (the secret is exposed via env below). The step always runs but
        # no-ops cleanly when the signing key is not configured.
        working-directory: assets
        env:
          # The Ed25519 private key, stored as a GitHub repository secret.
          # Format: the raw contents of the minisign .sec file (base64 blob).
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          # Passphrase for the private key (empty string if the key has no passphrase).
          MINISIGN_SECRET_KEY_PASSWORD: ${{ secrets.MINISIGN_SECRET_KEY_PASSWORD }}
        run: |
          # Secret-present gate (in-script, since `secrets` is not allowed in
          # step `if:`). This job only runs on a real tag push (release), so a
          # missing key here means an unsigned public release — fail closed
          # rather than ship checksums the installers will reject.
          if [ -z "${MINISIGN_SECRET_KEY}" ]; then
            echo "::error::MINISIGN_SECRET_KEY not set — refusing to publish an unsigned release." >&2
            echo "Configure MINISIGN_SECRET_KEY (+ _PASSWORD) or this release cannot be signed." >&2
            exit 1
          fi

          # Install minisign on the runner (ubuntu-24.04; the release job).
          # minisign lives in the universe pocket (Ubuntu 23.10+). apt-get update
          # first — without a fresh package index the install fails with
          # "Unable to locate package".
          sudo apt-get update
          sudo apt-get install -y minisign

          # Write the private key to a mode-0600 temp file. The key is provided
          # as the raw .sec file contents via the secret; minisign -S requires a
          # file path (not inline key material).
          MINISIGN_KEY_FILE="$(mktemp)"
          chmod 600 "${MINISIGN_KEY_FILE}"
          printf '%s' "${MINISIGN_SECRET_KEY}" > "${MINISIGN_KEY_FILE}"

          # Sign checksums.txt. -S = sign, -s = private key path, -m = file to sign.
          # minisign reads the passphrase from stdin when -W is not set; supply
          # it via echo to avoid interactive prompts.
          echo "${MINISIGN_SECRET_KEY_PASSWORD}" \
            | minisign -S -s "${MINISIGN_KEY_FILE}" -m checksums.txt

          # Securely remove the private key temp file.
          rm -f "${MINISIGN_KEY_FILE}"

          echo "checksums.txt.minisig produced."

      - name: Create release and upload assets
        # checksums.txt.minisig is included when present (i.e. when
        # MINISIGN_SECRET_KEY is populated and the signing step ran).
        # The glob 'assets/checksums.txt.minisig' is silently absent if the
        # signing step was skipped; action-gh-release ignores missing glob matches.
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: |
            assets/checksums.txt
            assets/checksums.txt.minisig
            assets/flat/*
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Homebrew tap to update formula
        # Fire a repository_dispatch to the Homebrew tap repo so it re-runs
        # update-formula.sh with this release's tag. The tap workflow also
        # runs on a daily cron as a safety net, so a failed dispatch is
        # self-healing. Best-effort: a missing or expired PAT must not block
        # the release itself.
        if: ${{ always() }}
        env:
          HOMEBREW_TAP_PAT: ${{ secrets.HOMEBREW_TAP_PAT }}
        run: |
          if [ -z "$HOMEBREW_TAP_PAT" ]; then
            echo "::warning::HOMEBREW_TAP_PAT not set — skipping Homebrew dispatch (daily cron will catch up)"
            exit 0
          fi
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $HOMEBREW_TAP_PAT" \
            "https://api.github.com/repos/codedaptive/homebrew-mootx01-ce/dispatches" \
            -d "{\"event_type\":\"ce-release\",\"client_payload\":{\"tag\":\"$RELEASE_TAG\"}}" \
          || echo "::warning::Homebrew tap dispatch failed — the daily cron will catch up"

  # ── Update winget manifests and commit back ──────────────────────────────
  # Keeps distribution/windows/winget/* current with every release so the
  # wingetcreate submit step is always a one-liner. Updates the local
  # manifests (version, URLs, SHA256s) and commits to develop. Best-effort:
  # must not block the release.
  update-winget:
    name: Update winget manifests
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: [release]
    runs-on: ubuntu-latest
    # Writes the updated manifests back to develop/1.0.x. Declared explicitly
    # because the workflow-wide default is now contents: read. NOTE: the actual
    # git push authenticates with the WINGET_PUSH_PAT persisted by the checkout
    # below (persist-credentials stays at its default so that PAT survives into
    # the push step); this write scope documents the job's repo-write intent.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: develop/1.0.x
          # persist-credentials intentionally left at its default (true): the
          # git push below relies on this PAT being written to .git/config.
          token: ${{ secrets.WINGET_PUSH_PAT }}

      - name: Update winget manifests
        run: |
          VERSION="${RELEASE_TAG#v}"
          bash distribution/windows/update-winget.sh "$VERSION"

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- distribution/windows/winget/; then
            echo "Winget manifests already current — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add distribution/windows/winget/
          git commit -m "ci: update winget manifests to ${RELEASE_TAG} (automated)"
          git push

  # ── Build moot-memory distribution ──────────────────────────────────────
  # Builds the sdist + wheel with an ARBITRARY Python build backend
  # (pyproject build hooks, build-time deps). Deliberately split from
  # publish-pypi: this job holds NO id-token, so a compromised `build` or
  # build-time dependency cannot mint the PyPI OIDC publish token. Mirrors
  # the Windows build/sign split — untrusted build here, trusted publish next.
  build-pypi:
    name: Build moot-memory distribution
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: read   # checkout only — NO id-token in the build job
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          # No publish credential here, but never persist a git token when
          # arbitrary build-backend code executes.
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Build distribution
        run: |
          cd apps/moot-memory-adapter
          # Sync version from release tag. Validate the tag against the strict
          # release-version regex BEFORE it reaches sed (same gate every other
          # job applies to RELEASE_TAG) so a tag with shell/sed metacharacters
          # can't corrupt pyproject.toml.
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+(\.[0-9]+){2}(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "mootx01: invalid release tag: $TAG" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          sed -i "s/^version = .*/version = \"$VERSION\"/" pyproject.toml
          python -m pip install --upgrade build
          python -m build

      - name: Upload distribution
        # Hand the built sdist + wheel to publish-pypi. That job holds the OIDC
        # publish credential and runs NO build step — it only uploads these.
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: pypi-dist
          path: apps/moot-memory-adapter/dist/

  # ── Publish moot-memory to PyPI ─────────────────────────────────────────
  # pip install moot-memory for Messages API users.
  # Uses PyPI Trusted Publishing (OIDC); configure the moot-memory PyPI project
  # to trust this repository, workflow, and release environment. Trusted,
  # build-free publish job: it holds id-token: write but runs no arbitrary
  # package build/install — only the upload of the artifact from build-pypi.
  publish-pypi:
    name: Publish moot-memory to PyPI
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: [build-pypi]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/moot-memory
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distribution
        # Places the sdist + wheel where gh-action-pypi-publish expects them.
        # No checkout, no build — nothing arbitrary runs while id-token is live.
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: pypi-dist
          path: dist/

      - name: Publish distribution to PyPI
        # Pinned by commit SHA like every other action in this workflow —
        # `release/v1` is a mutable branch and this step holds the OIDC
        # publish credential.
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: dist/
          # Idempotent re-runs: if this version is already on PyPI (e.g. a tag
          # was force-moved and the workflow re-fired), skip instead of erroring
          # — PyPI rejects re-uploading an existing version.
          skip-existing: true

  # ── Submit to winget-pkgs (Microsoft community repository) ──────────────
  # Opens a PR against microsoft/winget-pkgs so `winget install/upgrade`
  # sees the new version. Requires WINGET_SUBMIT_PAT — a classic PAT with
  # public_repo scope (fine-grained PATs cannot access repos outside the org).
  submit-winget:
    name: Submit to winget-pkgs
    # Runs on tag push (the normal release path), or on manual dispatch with
    # `winget-tag` set (resubmission for an already-published release — see the
    # workflow_dispatch comment at the top). `!cancelled()` lets the dispatch
    # path run even though its `needs` (update-winget) is skipped on dispatch;
    # the manifests in this repo were already updated by the original tag run.
    if: ${{ !cancelled() && ((startsWith(github.ref, 'refs/tags/') && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && github.event.inputs.winget-tag != '')) }}
    needs: [update-winget]
    runs-on: windows-latest
    steps:
      - name: Submit via wingetcreate
        env:
          WINGET_PAT: ${{ secrets.WINGET_SUBMIT_PAT }}
          RELEASE_TAG: ${{ github.event.inputs.winget-tag || github.ref_name }}
          WINGETCREATE_VERSION: v1.12.8.0
          WINGETCREATE_SHA256: 8BD738851B524885410112678E3771B341C5C716DE60FBBECB88AB0A363ED85D
        run: |
          if (-not $env:WINGET_PAT) {
            Write-Host "::warning::WINGET_SUBMIT_PAT missing — skipping winget-pkgs submission"
            exit 0
          }
          # The tag is untrusted input (dispatch box or tag name): validate
          # against the strict release-version shape before it reaches URLs.
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
            Write-Host "::error::RELEASE_TAG '$($env:RELEASE_TAG)' is not a release version tag (vX.Y.Z)"
            exit 1
          }
          $VERSION = $env:RELEASE_TAG -replace '^v',''
          $X86_URL = "https://github.com/codedaptive/mootx01-ce/releases/download/$($env:RELEASE_TAG)/mootx01-$VERSION-windows-x86_64-setup.exe"
          $ARM_URL = "https://github.com/codedaptive/mootx01-ce/releases/download/$($env:RELEASE_TAG)/mootx01-$VERSION-windows-arm64-setup.exe"
          # Download a pinned wingetcreate release and verify its checked-in SHA-256
          # before executing it with WINGET_PAT in scope.
          $WingetCreateUrl = "https://github.com/microsoft/winget-create/releases/download/$($env:WINGETCREATE_VERSION)/wingetcreate.exe"
          Invoke-WebRequest -Uri $WingetCreateUrl -OutFile wingetcreate.exe
          $ActualSha256 = (Get-FileHash -Path wingetcreate.exe -Algorithm SHA256).Hash
          if ($ActualSha256 -ne $env:WINGETCREATE_SHA256) {
            Write-Host "::error::wingetcreate.exe SHA-256 mismatch. Expected $($env:WINGETCREATE_SHA256), got $ActualSha256"
            exit 1
          }
          # Submit: creates a PR on microsoft/winget-pkgs.
          # The package identifier is POSITIONAL — wingetcreate has no --id
          # option and exits 1 with "Option 'id' is unknown" if given one.
          # Each URL pins its architecture via the `|arch` override: our x64
          # setup EXE carries a 32-bit Inno stub, so wingetcreate's binary
          # detection reports it as X86, which matches NEITHER existing
          # manifest entry exactly and both by installer type — the
          # "Multiple matches found for X86 Inno installer" failure that
          # blocked the 1.0.26 and 1.0.27 submissions.
          .\wingetcreate.exe update `
            Codedaptive.MOOTx01 `
            --version $VERSION `
            --urls "$X86_URL|x64" "$ARM_URL|arm64" `
            --token $env:WINGET_PAT `
            --submit
        shell: pwsh
