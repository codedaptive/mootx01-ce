name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ── macOS builds (arm64 + x86_64) ─────────────────────────────────────────
  build-macos-arm64:
    name: Build macOS arm64
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Swift 6.2 toolchain (latest stable Xcode)
        # macos-26 carries the Swift 6.2 OS runtime the packages require; pair it
        # with the latest stable Xcode so the build toolchain and runtime match.
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Swift version
        run: swift --version

      - name: Build release binaries
        run: |
          # mootx01 = MCP server + management CLI; moot-mgr = the management
          # console (resident host + loopback dashboard). The macOS moot-mgr is a
          # SwiftUI app (built here and on x86_64); Linux and Windows ship the
          # headless Rust moot-mgr (built in their respective jobs) — its control
          # channel is a Unix-domain socket on Unix and a named pipe on Windows.
          swift build -c release --package-path apps/mootx01 --product mootx01
          swift build -c release --package-path apps/moot-mgr --product moot-mgr

      - name: Import Developer ID Certificate
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_SIGNING_CERT_P12 }}
          CERT_P12_PASSWORD: ${{ secrets.APPLE_SIGNING_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASS="$(openssl rand -base64 32)"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERT_P12_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          rm "$RUNNER_TEMP/cert.p12"

      - name: Sign binaries
        run: |
          IDENTITY="Developer ID Application: Codedaptive, LLC (${{ secrets.APPLE_TEAM_ID }})"
          MOOT_BIN="$(find apps/mootx01/.build -name mootx01 -path '*/release/mootx01' | head -1)"
          MGR_BIN="$(find apps/moot-mgr/.build -name moot-mgr -path '*/release/moot-mgr' | head -1)"
          codesign --options runtime --timestamp --sign "$IDENTITY" "$MOOT_BIN"
          codesign --options runtime --timestamp --sign "$IDENTITY" "$MGR_BIN"
          codesign --verify --deep --strict --verbose=2 "$MOOT_BIN"
          codesign --verify --deep --strict --verbose=2 "$MGR_BIN"
          echo "MOOT_BIN=$MOOT_BIN" >> "$GITHUB_ENV"
          echo "MGR_BIN=$MGR_BIN"  >> "$GITHUB_ENV"

      - name: Notarize binaries
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          mkdir -p ~/.private_keys
          echo "$APPLE_API_KEY_P8" | base64 --decode > \
            ~/.private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          zip -j "$RUNNER_TEMP/binaries.zip" "$MOOT_BIN" "$MGR_BIN"
          xcrun notarytool submit "$RUNNER_TEMP/binaries.zip" \
            --key ~/.private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8 \
            --key-id "${{ secrets.APPLE_API_KEY_ID }}" \
            --issuer "${{ secrets.APPLE_API_KEY_ISSUER }}" \
            --wait
          rm -f ~/.private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8

      - name: Package binaries
        run: |
          VERSION="${{ github.ref_name }}"
          ASSET="mootx01-${VERSION}-macos-arm64.tar.gz"
          cp "$MOOT_BIN" mootx01
          cp "$MGR_BIN" moot-mgr
          tar -czf "${ASSET}" mootx01 moot-mgr
          echo "ASSET=${ASSET}" >> "${GITHUB_ENV}"

      - name: Upload asset
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: ${{ env.ASSET }}

  build-macos-x86_64:
    name: Build macOS x86_64
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Swift 6.2 toolchain (latest stable Xcode)
        # See arm64 job: macos-26 ships the 6.2 runtime; latest-stable Xcode matches it.
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Swift version
        run: swift --version

      - name: Build release binaries (cross-compile to x86_64)
        run: |
          # Both binaries cross-compiled to x86_64; see the arm64 job for the
          # mootx01/moot-mgr split rationale (macOS moot-mgr = SwiftUI app).
          swift build -c release --package-path apps/mootx01 --product mootx01 --arch x86_64
          swift build -c release --package-path apps/moot-mgr --product moot-mgr --arch x86_64

      - name: Import Developer ID Certificate
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_SIGNING_CERT_P12 }}
          CERT_P12_PASSWORD: ${{ secrets.APPLE_SIGNING_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASS="$(openssl rand -base64 32)"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERT_P12_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          rm "$RUNNER_TEMP/cert.p12"

      - name: Sign binaries
        run: |
          IDENTITY="Developer ID Application: Codedaptive, LLC (${{ secrets.APPLE_TEAM_ID }})"
          MOOT_BIN="$(find apps/mootx01/.build -name mootx01 -path '*/release/mootx01' | head -1)"
          MGR_BIN="$(find apps/moot-mgr/.build -name moot-mgr -path '*/release/moot-mgr' | head -1)"
          codesign --options runtime --timestamp --sign "$IDENTITY" "$MOOT_BIN"
          codesign --options runtime --timestamp --sign "$IDENTITY" "$MGR_BIN"
          codesign --verify --deep --strict --verbose=2 "$MOOT_BIN"
          codesign --verify --deep --strict --verbose=2 "$MGR_BIN"
          echo "MOOT_BIN=$MOOT_BIN" >> "$GITHUB_ENV"
          echo "MGR_BIN=$MGR_BIN"  >> "$GITHUB_ENV"

      - name: Notarize binaries
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          mkdir -p ~/.private_keys
          echo "$APPLE_API_KEY_P8" | base64 --decode > \
            ~/.private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          zip -j "$RUNNER_TEMP/binaries.zip" "$MOOT_BIN" "$MGR_BIN"
          xcrun notarytool submit "$RUNNER_TEMP/binaries.zip" \
            --key ~/.private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8 \
            --key-id "${{ secrets.APPLE_API_KEY_ID }}" \
            --issuer "${{ secrets.APPLE_API_KEY_ISSUER }}" \
            --wait
          rm -f ~/.private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8

      - name: Package binaries
        run: |
          VERSION="${{ github.ref_name }}"
          ASSET="mootx01-${VERSION}-macos-x86_64.tar.gz"
          cp "$MOOT_BIN" mootx01
          cp "$MGR_BIN" moot-mgr
          tar -czf "${ASSET}" mootx01 moot-mgr
          echo "ASSET=${ASSET}" >> "${GITHUB_ENV}"

      - name: Upload asset
        uses: actions/upload-artifact@v4
        with:
          name: macos-x86_64
          path: ${{ env.ASSET }}

  # ── Linux builds (x86_64 + arm64) ─────────────────────────────────────────
  # Linux ships the Rust CLI from apps/mootx01/rust (NOT the Swift installer —
  # Swift has no Linux GUI, and the Swift package's non-macOS branch omits
  # `serve`). The Rust binary is the complete CLI: install, db, status, query,
  # proxy, serve, uninstall, upgrade. Verified green by rust-cli.yml.
  build-linux-x86_64:
    name: Build Linux x86_64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/mootx01/rust/target
          key: release-rust-linux-x86_64-${{ hashFiles('apps/mootx01/rust/Cargo.toml') }}
          restore-keys: release-rust-linux-x86_64-

      - name: Build release binaries
        run: |
          cargo build --release --locked --manifest-path apps/mootx01/rust/Cargo.toml
          cargo build --release --locked --manifest-path apps/moot-mgr/rust/Cargo.toml

      - name: Package binaries
        run: |
          VERSION="${{ github.ref_name }}"
          ASSET="mootx01-${VERSION}-linux-x86_64.tar.gz"
          cp apps/mootx01/rust/target/release/mootx01 mootx01
          cp apps/moot-mgr/rust/target/release/moot-mgr moot-mgr
          tar -czf "${ASSET}" mootx01 moot-mgr
          echo "ASSET=${ASSET}" >> "${GITHUB_ENV}"

      - name: Upload asset
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: ${{ env.ASSET }}

  build-linux-arm64:
    name: Build Linux arm64
    # GitHub-hosted arm64 Linux label is `ubuntu-22.04-arm` (no `-arm64` suffix);
    # the old `ubuntu-22.04-arm64` matched no runner and queued forever.
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/mootx01/rust/target
          key: release-rust-linux-arm64-${{ hashFiles('apps/mootx01/rust/Cargo.toml') }}
          restore-keys: release-rust-linux-arm64-

      - name: Build release binaries
        run: |
          cargo build --release --locked --manifest-path apps/mootx01/rust/Cargo.toml
          cargo build --release --locked --manifest-path apps/moot-mgr/rust/Cargo.toml

      - name: Package binaries
        run: |
          VERSION="${{ github.ref_name }}"
          ASSET="mootx01-${VERSION}-linux-arm64.tar.gz"
          cp apps/mootx01/rust/target/release/mootx01 mootx01
          cp apps/moot-mgr/rust/target/release/moot-mgr moot-mgr
          tar -czf "${ASSET}" mootx01 moot-mgr
          echo "ASSET=${ASSET}" >> "${GITHUB_ENV}"

      - name: Upload asset
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: ${{ env.ASSET }}

  # ── Windows build (x86_64) ────────────────────────────────────────────────
  # Windows ships the Rust CLI from apps/mootx01/rust — the complete install/db/
  # status/query/proxy/serve/uninstall/upgrade surface — AND the Rust moot-mgr
  # console (apps/moot-mgr/rust), whose control channel is a named pipe on Windows.
  # NOT the ARIA MCP server (packages/kits/AriaMcpKit/rust) which is an internal
  # library, not the user-facing CLI.
  build-windows-x86_64:
    name: Build Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/mootx01/rust/target
            apps/moot-mgr/rust/target
          key: release-rust-windows-x86_64-${{ hashFiles('apps/mootx01/rust/Cargo.toml', 'apps/moot-mgr/rust/Cargo.toml') }}
          restore-keys: release-rust-windows-x86_64-

      - name: Build release binaries
        run: |
          cargo build --release --locked --manifest-path apps/mootx01/rust/Cargo.toml --target x86_64-pc-windows-msvc
          cargo build --release --locked --manifest-path apps/moot-mgr/rust/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Package binaries
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $asset = "mootx01-${version}-windows-x86_64.zip"
          Copy-Item "apps/mootx01/rust/target/x86_64-pc-windows-msvc/release/mootx01.exe" "mootx01.exe"
          Copy-Item "apps/moot-mgr/rust/target/x86_64-pc-windows-msvc/release/moot-mgr.exe" "moot-mgr.exe"
          Compress-Archive -Path "mootx01.exe", "moot-mgr.exe" -DestinationPath $asset
          "ASSET=$asset" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload asset
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: ${{ env.ASSET }}

  # ── Windows build (arm64) ─────────────────────────────────────────────────
  # Native arm64 Windows build on the windows-11-arm runner — the same Rust CLI
  # (apps/mootx01/rust) + Rust console (apps/moot-mgr/rust) as the x86_64 job,
  # for Snapdragon-class Windows-on-ARM machines.
  build-windows-arm64:
    name: Build Windows arm64
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/mootx01/rust/target
            apps/moot-mgr/rust/target
          key: release-rust-windows-arm64-${{ hashFiles('apps/mootx01/rust/Cargo.toml', 'apps/moot-mgr/rust/Cargo.toml') }}
          restore-keys: release-rust-windows-arm64-

      - name: Build release binaries
        run: |
          cargo build --release --locked --manifest-path apps/mootx01/rust/Cargo.toml --target aarch64-pc-windows-msvc
          cargo build --release --locked --manifest-path apps/moot-mgr/rust/Cargo.toml --target aarch64-pc-windows-msvc

      - name: Package binaries
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $asset = "mootx01-${version}-windows-arm64.zip"
          Copy-Item "apps/mootx01/rust/target/aarch64-pc-windows-msvc/release/mootx01.exe" "mootx01.exe"
          Copy-Item "apps/moot-mgr/rust/target/aarch64-pc-windows-msvc/release/moot-mgr.exe" "moot-mgr.exe"
          Compress-Archive -Path "mootx01.exe", "moot-mgr.exe" -DestinationPath $asset
          "ASSET=$asset" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload asset
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm64
          path: ${{ env.ASSET }}

  # ── Create GitHub release + attach assets ──────────────────────────────────
  release:
    name: Create Release
    needs:
      - build-macos-arm64
      - build-macos-x86_64
      - build-linux-x86_64
      - build-linux-arm64
      - build-windows-x86_64
      - build-windows-arm64
    runs-on: ubuntu-22.04
    steps:
      - name: Download all assets
        uses: actions/download-artifact@v4
        with:
          path: assets

      - name: Checkout repository (for bundled public key)
        uses: actions/checkout@v4

      - name: Generate checksums.txt
        working-directory: assets
        run: |
          # Collect all release archives from subdirs into one flat dir.
          mkdir -p flat
          find . -name '*.tar.gz' -o -name '*.zip' | xargs -I{} cp {} flat/
          cd flat
          sha256sum * > ../checksums.txt

      # ── Minisign signature (CAND-004) ──────────────────────────────────────
      # Signs checksums.txt with the project's Ed25519 private key, producing
      # checksums.txt.minisig. The .minisig file is uploaded as a release asset
      # alongside checksums.txt; Linux/POSIX installers (`install.sh`) and the
      # `mootx01 upgrade` command download and verify it against the public key
      # bundled at scripts/minisign.pub in the repository.
      #
      # OPERATOR ACTION REQUIRED to activate:
      #   1. Generate a keypair:
      #        minisign -G -p scripts/minisign.pub -s /path/to/minisign.sec
      #   2. Replace any PLACEHOLDER content in scripts/minisign.pub with the
      #      generated public key and commit it.
      #   3. Add two GitHub repository secrets:
      #        MINISIGN_SECRET_KEY          — contents of /path/to/minisign.sec
      #        MINISIGN_SECRET_KEY_PASSWORD — passphrase (empty string if none)
      #
      # Until these secrets are populated, this step is skipped (the `if:` guard
      # below checks for secret presence). Installers will fail closed when they
      # encounter a missing .minisig — this is expected until the operator
      # completes the steps above.
      - name: Sign checksums with minisign (CAND-004)
        # NOTE: GitHub Actions forbids referencing `secrets` in a step-level
        # `if:` conditional, so the secret-present check is done INSIDE the
        # script (the secret is exposed via env below). The step always runs but
        # no-ops cleanly when the signing key is not configured.
        working-directory: assets
        env:
          # The Ed25519 private key, stored as a GitHub repository secret.
          # Format: the raw contents of the minisign .sec file (base64 blob).
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          # Passphrase for the private key (empty string if the key has no passphrase).
          MINISIGN_SECRET_KEY_PASSWORD: ${{ secrets.MINISIGN_SECRET_KEY_PASSWORD }}
        run: |
          # Secret-present gate (in-script, since `secrets` is not allowed in
          # step `if:`). Without a configured signing key, skip cleanly — the
          # release publishes unsigned and Linux/POSIX installers fail-closed.
          if [ -z "${MINISIGN_SECRET_KEY}" ]; then
            echo "MINISIGN_SECRET_KEY not set — skipping signing (release will be unsigned)."
            exit 0
          fi

          # Install minisign on the runner (ubuntu-22.04; the release job).
          # minisign is not pre-installed on GitHub-hosted ubuntu runners.
          sudo apt-get install -y minisign

          # Write the private key to a mode-0600 temp file. The key is provided
          # as the raw .sec file contents via the secret; minisign -S requires a
          # file path (not inline key material).
          MINISIGN_KEY_FILE="$(mktemp)"
          chmod 600 "${MINISIGN_KEY_FILE}"
          printf '%s' "${MINISIGN_SECRET_KEY}" > "${MINISIGN_KEY_FILE}"

          # Sign checksums.txt. -S = sign, -s = private key path, -m = file to sign.
          # minisign reads the passphrase from stdin when -W is not set; supply
          # it via echo to avoid interactive prompts.
          echo "${MINISIGN_SECRET_KEY_PASSWORD}" \
            | minisign -S -s "${MINISIGN_KEY_FILE}" -m checksums.txt

          # Securely remove the private key temp file.
          rm -f "${MINISIGN_KEY_FILE}"

          echo "checksums.txt.minisig produced."

      - name: Create release and upload assets
        # checksums.txt.minisig is included when present (i.e. when
        # MINISIGN_SECRET_KEY is populated and the signing step ran).
        # The glob 'assets/checksums.txt.minisig' is silently absent if the
        # signing step was skipped; action-gh-release ignores missing glob matches.
        uses: softprops/action-gh-release@v2
        with:
          files: |
            assets/checksums.txt
            assets/checksums.txt.minisig
            assets/flat/*
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
