name: CLA

# Contributor License Agreement gate.
#
# On every pull request the CLA Assistant checks whether the PR author has
# signed the CLA (see CLA.md). If not, it posts a comment; the contributor
# signs by replying with the agreement phrase below. Signatures are recorded
# in a JSON file on the `cla-signatures` branch of this repo, and the PR is
# blocked by a failing status check until the author has signed.
#
# One-time setup required before this works:
#   1. Create a repository secret named PERSONAL_ACCESS_TOKEN — a fine-grained
#      or classic PAT with `repo` scope. It is used to write the signature
#      file to the `cla-signatures` branch. GITHUB_TOKEN is not used for that
#      write on purpose: a commit made with GITHUB_TOKEN does not trigger the
#      recheck, and a PAT keeps the signature store auditable under a real
#      account.
#   2. Make the CLA status check required for merge in branch protection.
# The `cla-signatures` branch is created automatically on the first signature.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write        # write the signature file to the cla-signatures branch
  pull-requests: write   # post/update the CLA comment
  statuses: write        # set the CLA status check

jobs:
  cla:
    runs-on: ubuntu-latest
    # Run on the sign/recheck comment, or on any pull_request_target event.
    if: (github.event.issue.pull_request && contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA')) || contains(github.event.comment.body, 'recheck') || github.event_name == 'pull_request_target'
    steps:
      - name: CLA Assistant
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT used only to store signatures on the cla-signatures branch.
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          # The exact phrase a contributor comments to sign.
          custom-notsigned-prcomment: >-
            Thank you for your contribution to MOOTx01. Before it can be merged
            we need you to sign our Contributor License Agreement. You can read
            it here: **[CLA.md](https://github.com/codedaptive/mootx01-ce/blob/HEAD/CLA.md)**.
            To sign, post a comment on this pull request with exactly the
            following text:
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA. Thank you.'

          # Where signatures are recorded (this repo, dedicated branch).
          path-to-signatures: 'signatures/version1/cla.json'
          branch: 'cla-signatures'
          # Link surfaced to contributors as the document they are signing.
          path-to-document: 'https://github.com/codedaptive/mootx01-ce/blob/HEAD/CLA.md'

          # Accounts exempt from signing (bots and maintainer automation).
          allowlist: bot*,dependabot[bot],github-actions[bot]
