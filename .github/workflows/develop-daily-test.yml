# Develop daily regression — `make test-full` on develop/1.1.x, once a day, only if it moved.
#
# The regression backstop. Local `make test` is the fast unit lane for TDD;
# this scheduled job runs the explicit full sweep (unit + product + validation
# + checks) against the active development branch — develop/1.1.x, where feature
# work now lands — to catch anything that slipped through review. The first step
# short-circuits when the branch had no commits in the last day, so a quiet
# branch doesn't burn a macOS runner for nothing.
#
# candidate/1.0.x and stable/1.0.x do NOT run make test — candidate proves
# installers work (candidate.yml); stable is a tagged snapshot of already-tested
# develop content.

name: develop daily test

on:
  schedule:
    # Daily, 08:00 UTC. A schedule trigger only fires from the DEFAULT branch's
    # copy of this file (default = develop/1.1.x since the 2026-07-30 flip), so
    # the schedule and the branch the jobs test are now the same line.
    - cron: "0 8 * * *"
  workflow_dispatch:   # manual "run it now" regardless of the moved-check

permissions:
  contents: read

# One daily-test run at a time. A manual dispatch during a scheduled run (or a
# second dispatch) cancels the older run instead of stacking a second macOS
# runner on the same branch state.
concurrency:
  group: develop-daily-test
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      moved: ${{ steps.check.outputs.moved }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: develop/1.1.x
          fetch-depth: 0
      - id: check
        run: |
          # Did develop move in the last day? A manual dispatch always runs.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "moved=true" >> "$GITHUB_OUTPUT"; echo "manual dispatch — running"; exit 0
          fi
          if [ -n "$(git log --since='24 hours ago' --oneline)" ]; then
            echo "moved=true"  >> "$GITHUB_OUTPUT"; echo "develop moved in the last 24h — running make test-full"
          else
            echo "moved=false" >> "$GITHUB_OUTPUT"; echo "develop unchanged in the last 24h — skipping"
          fi

  test:
    needs: gate
    if: ${{ needs.gate.outputs.moved == 'true' }}
    runs-on: macos-26
    env:
      # GitHub's newest runner Xcode is 26.6; the Apple-app surface needs the
      # macOS 27 SDK. Those roots are local-compile-only and the shipped
      # server does not depend on them. See scripts/moot-test.
      MOOT_SKIP_APPLE_BETA: '1'
    # Full sweep runs well under an hour; cap it so a hung/deadlocked test
    # fails the run instead of holding a macOS runner for the 6h default.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: develop/1.1.x
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - run: make test-full
